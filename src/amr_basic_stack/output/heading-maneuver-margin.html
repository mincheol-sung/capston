<div id="heading-maneuver-margin">
  <style>
    #heading-maneuver-margin { display: grid; gap: calc(var(--font-size-base) * .8); color: var(--foreground); }
    #heading-maneuver-margin svg { display: block; width: 100%; }
    #heading-maneuver-margin svg text { fill: var(--foreground); font-size: 12px; }
    #heading-maneuver-margin .capacity { fill: var(--viz-series-1); fill-opacity: .12; stroke: var(--viz-series-1); stroke-width: 2; }
    #heading-maneuver-margin .reserve { stroke: var(--viz-series-2); stroke-width: 5; }
    #heading-maneuver-margin .structure { stroke: var(--border); stroke-width: 1; fill: none; }
  </style>
  <h3>Heading에 따른 추가 회피 속도</h3>
  <div class="viz-controls">
    <label class="form-label" for="hmm-yaw">몸체 heading <output id="hmm-yaw-value" class="tabular-nums">0°</output>
      <input class="form-range" id="hmm-yaw" type="range" min="0" max="90" value="0" step="1">
    </label>
    <label class="form-label" for="hmm-speed">유지할 전진 속도 <output id="hmm-speed-value" class="tabular-nums">0.40 m/s</output>
      <input class="form-range" id="hmm-speed" type="range" min="0" max="0.7" value="0.4" step="0.01">
    </label>
  </div>
  <div id="hmm-plot"><svg role="img" aria-label="세계좌표계 속도 공간. heading에 따라 회전하는 휠 속도 허용 영역과 현재 전진 속도를 유지하며 추가할 수 있는 왼쪽 회피 속도."></svg></div>
  <div id="hmm-result" class="tabular-nums" aria-live="polite"></div>
  <div class="text-small">이상적 휠 제한 0.78 m/s · 회전 속도 0 · 가속도·축별 제한·장애물 미포함</div>
</div>
<script>
(() => {
  const root = document.getElementById('heading-maneuver-margin');
  const yaw = root.querySelector('#hmm-yaw');
  const speed = root.querySelector('#hmm-speed');
  const svg = root.querySelector('svg');
  const plot = root.querySelector('#hmm-plot');
  const ns = 'http://www.w3.org/2000/svg';
  function add(tag, attrs, text) {
    const el = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
    if (text !== undefined) el.textContent = text;
    svg.appendChild(el); return el;
  }
  function render() {
    const psi = Number(yaw.value)*Math.PI/180, v = Number(speed.value);
    const c = Math.cos(psi), s = Math.sin(psi), limit = .78;
    const vertices = [[limit,0],[0,limit],[-limit,0],[0,-limit]].map(([x,y]) => [c*x-s*y,s*x+c*y]);
    const intersections = [];
    vertices.forEach((a,i) => {
      const b = vertices[(i+1)%4];
      if (Math.abs(b[0]-a[0]) > 1e-10) {
        const t = (v-a[0])/(b[0]-a[0]);
        if (t >= -1e-10 && t <= 1+1e-10) intersections.push(a[1]+t*(b[1]-a[1]));
      }
    });
    const feasible = v*(Math.abs(c)+Math.abs(s)) <= limit+1e-10;
    const upper = intersections.length ? Math.max(...intersections) : null;
    const w = Math.max(300, plot.clientWidth), h = Math.min(430,w+30);
    const side = Math.min(w-94,h-80), left = 65+(w-94-side)/2, top = 18;
    const domain = limit*1.12;
    const x = value => left+side*(value+domain)/(2*domain);
    const y = value => top+side*(domain-value)/(2*domain);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.replaceChildren();
    add('rect', {'data-chart-frame':'',x:left,y:top,width:side,height:side,class:'structure'});
    add('line', {x1:x(-domain),y1:y(0),x2:x(domain),y2:y(0),class:'structure'});
    add('line', {x1:x(0),y1:y(-domain),x2:x(0),y2:y(domain),class:'structure'});
    [-.6,0,.6].forEach(t => {
      add('text',{x:x(t),y:top+side+18,'text-anchor':'middle'},t.toFixed(1));
      add('text',{x:left-8,y:y(t)+4,'text-anchor':'end'},t.toFixed(1));
    });
    add('text',{x:left+side/2,y:top+side+40,'text-anchor':'middle',class:'axis-title','data-axis':'x'},'전진 vx (m/s)');
    add('text',{transform:`translate(16 ${top+side/2}) rotate(-90)`,'text-anchor':'middle',class:'axis-title','data-axis':'y'},'왼쪽 이동 vy (m/s)');
    add('polygon',{points:vertices.map(p => `${x(p[0])},${y(p[1])}`).join(' '),class:'capacity'});
    add('line',{x1:x(v),y1:y(-domain),x2:x(v),y2:y(domain),stroke:'var(--muted-foreground)','stroke-dasharray':'4 4'});
    if (feasible && upper !== null) {
      add('line',{x1:x(v),y1:y(0),x2:x(v),y2:y(upper),class:'reserve'});
      add('circle',{cx:x(v),cy:y(upper),r:4,fill:'var(--viz-series-2)'});
    }
    add('circle',{cx:x(v),cy:y(0),r:5,fill:feasible?'var(--foreground)':'var(--destructive)'});
    root.querySelector('#hmm-yaw-value').textContent = `${yaw.value}°`;
    root.querySelector('#hmm-speed-value').textContent = `${v.toFixed(2)} m/s`;
    root.querySelector('#hmm-result').textContent = feasible
      ? `● 현재 속도 → 선분 끝: 추가 가능한 왼쪽 속도 ${Math.max(0,upper).toFixed(3)} m/s`
      : '현재 전진 속도 자체가 휠 제한을 초과함';
  }
  function restore(state) {
    const saved = state?.modelContent;
    if (saved && Number.isFinite(saved.headingDeg) && Number.isFinite(saved.forwardMps)) {
      yaw.value = Math.max(0,Math.min(90,saved.headingDeg));
      speed.value = Math.max(0,Math.min(.7,saved.forwardMps));
    }
    render();
  }
  [yaw,speed].forEach(input => input.addEventListener('input', () => {
    render();
    window.openai?.setWidgetState?.({modelContent:{headingDeg:Number(yaw.value),forwardMps:Number(speed.value)},privateContent:null})?.catch(() => {});
  }));
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);
  });
  new ResizeObserver(render).observe(plot);
  restore(window.openai?.widgetState);
})();
</script>
