# 토크 MPC 스택(구조도 v3) 플랜트 파라미터 — 단일 출처
# ===================================================================
# 쓰는 곳: amr_mpc/torque/model.py(모델), sim_plant_torque_node(시뮬 플랜트),
#          이후 torque_mpc_node·torque_output·ak40_can_node 도 같은 값을 읽는다.
# 근거: 『메카넘 토크 MPC 1판 설계』(2026-11-05) 식-1~8, 설정값 표.
# ★ 실측 전 값이 많다. "추정" 표시가 붙은 것은 amr/notes_amr/To do.md 의 측정 항목이다.
#   측정이 끝나면 이 파일만 고친다. 코드는 바꾸지 않는다.
#
# 2026-11-10 결정 (torque_mpc_todo.md): 노미널 MPC 가 기본이고, 1판의 추가 항은 스위치로 둔다.
#   - 모델의 바퀴 관성 J_w      → model.use_wheel_inertia (2026-11-16 부터 기본 true) — 시뮬 플랜트 물리만.
#                                 제어기(torque_mpc_node)는 M 에 m_w = 4J_w/r² 를 늘 넣고 w 항만 torque_mpc.yaml model_terms.use_w 로
#   - 구동계 마찰 보상 τ_fric   → friction.* ([FL, FR, RL, RR]별 벤치 후보값)
#   - 외란 추정치 d̂            → torque_mpc.yaml (3단계에서 만든다, 기본 끔)
# ===================================================================

# ── 기하: 드라이버 twist_to_wheels 와 같은 값 (plant_wheel.yaml geometry 와 같다)
#    ω_i = (v_x ± v_y ± k ω_z)/r,  k = (wheel_base + width)/2 = 0.1932 m
#    2026-11-19 새 하부 (frame + AK40-10 + 커플러): 축간 172.4 mm (문서 "AMR 하부 변경 전달 사항"의 CAD), 트랙 214.0 mm (사용자 지정 —
#      plant.yaml 과 같게. 문서 CAD 는 231.9) → l_x 0.0862, l_y 0.1070. 예전 하부: 0.1897 / 0.207 (k 0.19835)
geometry:
  wheel_radius_m: 0.04
  wheel_base_m:   0.1724
  robot_width_m:  0.2140

# ── 차체
body:
  mass_kg: 4.56          # 2026-11-15 저울 실측 (AK40 장착, 배터리 포함, 적재 없음). 이전 4.0 은 1판 추정
  payload_kg: 0.0        # 적재 조건: 0 또는 5 (2차 발표). 실제 질량 = mass_kg + payload_kg
  # 바퀴별 수직력 몫 [FL, FR, RL, RR] (합 1) — N_i = 몫_i·m g. 2026-11-18 정지 저울 측정 (저울 1 개, 두 바퀴씩 3 회 평균,
  #   analysis/torque_mpc_real/2026-11-18_load/RESULTS_KO.md): 앞 합 2199 g · 뒤 2401 g → 앞 비율 0.478,
  #   왼쪽 2280 g · 오른쪽 2283 g → 0.4997. 대각(FL+RR vs FR+RL)은 두 바퀴씩으로는 못 재서 0 으로 둔 값
  #   (네 바퀴 받침은 static indeterminate — 바닥 평탄도에 따라 바뀐다). 무게중심은 가운데서 뒤로 3.8 mm.
  #   쓰는 곳: torque_mpc_node 의 friction 상한 τ_μ,i = (r/√2)·μ̂·N_i·c_s, 시뮬 SlipPlant 의 F_i = μ N_i tanh(·).
  #   μ̂ 는 바닥 값(surface.mu_hat) 하나 — 바닥을 바꿔도 이 몫은 그대로. 적재(payload)를 싣거나 하부를 바꾸면 다시 잰다.
  #   비우면 1/4 씩 (예전 mg/4). 한 번만 바꿀 때 launch 인자 wheel_load_share:="0.25,0.25,0.25,0.25"
  wheel_load_share: [0.2388, 0.2392, 0.2608, 0.2612]
  inertia_z_kgm2: 0.06   # 추정. 리포에 값 없음. 0.3 × 0.3 m 균일판 4 kg 근사 m(a²+b²)/12.
                         #   CAD 또는 제자리 회전 가속 시험으로 바꾼다 (To do 2절)

# ── 바퀴·모터 (CubeMars AK40-10 KV170, 10:1, MIT 모드)
wheel:
  inertia_J_w_kgm2: 8.9e-4   # 2026-11-12 팀원 벤치 (바퀴 장착·띄움, 출력축, 명령 토크 기준) 4개 평균.
                             #   FL 8.65 / FR 8.89 / RL 9.18 / RR 8.76 ×10⁻⁴. FR·RL 은 중단된 판 일부 → 재시험 뒤 확정.
                             #   예전 추정 9.7e-4 (데이터시트 로터 97.35 g·cm² × 기어비² 100) 와 10 % 안.
                             #   amr/notes_amr/CAN/BENCH_RESULTS_KO.md
                             #   2026-11-16 확인: 장착 그대로 띄워 계단 차분(마찰 소거) — 네 바퀴 121 계단 중앙 8.77e-4 (−1.4 %) → 그대로.
                             #   바퀴별 중앙 FL 9.76 / FR 9.35 / RL 6.8~7.8 / RR 9.12 ×10⁻⁴ (RL 만 낮음, 미해결).
                             #   analysis/torque_mpc_real/2026-11-16_jw/RESULTS_KO.md
  # 모터·감속기·장착 바퀴의 출력축 등가 관성 후보 [kg·m²], 순서 [FL, FR, RL, RR].
  # 2026-11-13: 최신 채택 LPF candidate에서 개별 구분. RR은 마지막 재시험, FR/RL은 중단 데이터.
  # 현재는 구분 보관용이며 계산에는 위 공통 inertia_J_w_kgm2를 계속 사용한다.
  # use_wheel_inertia=false도 유지. 개별 관성의 동역학 반영은 별도 변경이 필요하다.
  inertia_J_w_per_wheel_kgm2: [0.0008654796609443044, 0.0008889159579280763, 0.000917740329631651, 0.0008758732432891204]
motor:
  # 공식 AK40-10 KV170: 24 V, 정격 1.3 N·m에서 370 rpm. 운용 속도 기준으로 채택.
  # https://www.cubemars.com/ko/product/ak40-10-robotic-actuator.html (2026-11-13 확인)
  rated_speed_rpm: 370.0    # 출력축 정격 속도. 물리적 최고속도와는 다름 (무부하 435 rpm).
  tau_rated_Nm: 1.3          # 정격. 1판 식-21 의 τ_lim
  tau_peak_Nm:  4.1          # 피크. 시뮬 플랜트·ak40_can_node 의 하드 클램프
  damping_kd:   0.02         # 추정. MODE_DAMPING 정지의 MIT kd [N·m·s/rad].
                             #   시뮬에서 4 kg 차체가 시정수 약 0.08 s 로 선다(4·kd/(r²·m)).
                             #   바퀴 띄운 시험 → 바닥 제동 거리로 정한다 (To do 1절)

# ── 구동계 마찰 τ_fric(ω) = sign(ω)·coulomb + viscous·ω  [N·m]
#    쓰는 곳: torque_output (MPC·PI 토크에 미리 더해 지운다), sim_plant_torque (플랜트의 실제 마찰, × friction_scale),
#             MPC·PI 상한 τ̄ = τ_lim − tau_fric_max (보상 몫을 남긴다)
#    순서 [FL, FR, RL, RR].
#    2026-11-16 실측(장착 그대로 바퀴 띄움, 무부하, 주행 직후 38~39 °C): 명령 0.045/0.04/0.035/0.03 N·m 각 3 s 의
#    마지막 1 s 평균 (ω, 명령 τ) 4 점 직선, ω 7.9~26.2 rad/s, 잔차 ≤ 0.5 mN·m. 코스트다운(토크 0 감속)도 같은 크기.
#    자료 analysis/torque_mpc_real/2026-11-16_jw/ss_*.csv · friction_steady.py · RESULTS_KO.md 끝 절.
#    11-14 값으로는 20 rad/s 에서 네 바퀴 모두 0.007~0.018 N·m 과보상이었다 (점성 항이 1.5~1.9 배) — 그 뒤 마찰이 줄었다.
#    FR 은 같은 속도에 0.003~0.005 N·m 더 든다 (작은 기계적 끌림, 2 배 아님).
#    (이전: 2026-11-14 내림 계단 30~32 °C coulomb [0.02142, 0.02151, 0.02170, 0.01830], viscous [0.002062, 0.001799, 0.001767, 0.001679];
#     2026-11-13 팀원 coulomb [0.0280, 0.0279, 0.0239, 0.0253], viscous [0.00113, 0.00235, 0.00221, 0.00080])
#    모르는 것: 정지 마찰(출발 토크 0.04~0.1 N·m — 정지 마찰 보상 static_Nm 몫), 온도(차가울 때 약 15 % 큼 → 0.9 배 보상이면
#    차가울 때 덜 보상 쪽), 26 rad/s 위(0.06 N·m 이상은 FL·RL 이 전압 한계 42 rad/s 에 닿아 못 잼 — 직선 외삽), 바닥 하중·롤러 마찰.
friction:
  coulomb_Nm: [0.0174, 0.0206, 0.0155, 0.0157]
  viscous_Nms_per_rad: [0.001066, 0.001158, 0.001112, 0.001177]
  compensation_scale: 0.9    # torque_output 은 위 값 × 이 값으로 보상한다 (시뮬 플랜트는 위 값 그대로 = 실제 마찰).
                             # 과보상은 정지 근처에서 바퀴를 스스로 밀어 떨림을 만들어 약간 덜 보상한다 (2026-11-14 사용자 결정 90 %).
  tau_fric_max_Nm: 0.1       # 사용자 요청으로 0.14에서 기존 0.1 복원. motor_only 상한=1.3-0.1=1.2.
                             # 2026-11-14 값으로 370 rpm(38.75 rad/s) 보상 최대 = 0.9 × 0.1013(FL) = 0.091 → 이 여유 안.
                             # 2026-11-16 값으로는 0.9 × 0.0655(FR) = 0.059 (+ 정지 마찰 보상은 정지 근처에서만 0.072).
  # 정지 마찰 F_s (Stribeck 모델의 정지 수준) — torque_output 의 정지 마찰 보상만 쓴다 (시뮬 플랜트에는 없음). 2026-11-16
  #   τ_static = F_s·exp(−(ω/ω_st)²)·tanh(ω_ref/ω_s) × compensation_scale, 방향은 기준 바퀴속도 ω_ref
  #   근거: 벤치 무부하 출발 토크 0.04~0.1 N·m, FL·RL 은 0.05 로 안 돌고 0.08 에서 돎 (real_robot_checklist 장착 부호).
  #         바닥 bag 2026-11-16/142534 FL·RR 은 모터 명령 0.076~0.087 N·m 로 1.78 s 붙어 있었고,
  #         142932 FL 은 같은 범위(최대 0.086)에서 0.32 s 뒤 풀림 → 바닥 출발 토크 ≈ 0.09 근처.
  #   0.08 × 0.9 = 0.072 N·m: 보상만으로는 출발 토크(≈0.09)보다 작아 기준이 있어도 MPC 순토크 없이는 안 돈다(스스로 안 밂),
  #   τ̄(C, 0.0759) 와 더하면 0.148 로 넘는다. 바퀴별 바닥 램프 시험 전 잠정값 — 4 개 같게 둔다.
  static_Nm: [0.08, 0.08, 0.08, 0.08]
  stribeck_rad_s: 0.5        # ω_st: |ω| 가 이만큼이면 정지 항이 e⁻¹ = 37 %, 1 rad/s 면 1.8 % (바퀴가 돌면 위 coulomb·viscous 만 남음)

# ── 노면 (C 비교군의 마찰 토크 상한 τ_μ = (r/√2)·μ̂·(m g/4)·c_s, 1판 식-21)
surface:
  mu_hat: 0.3                # 추정. 노면마다 토크 램프 시험 (To do 2절)
  # 바퀴별 μ̂ [FL, FR, RL, RR] (2026-11-19 (11), 사용자 제공 값 — 출처 bag·계산은 이 리포에 없다). mg/4 기준:
  #   τ_μ,i = (r/√2)·μ̂_i·(m g/4)·c_s — 실측 |τ_i| / ((r/√2)(mg/4)) 로 낸 값이라 하중 몫(body.wheel_load_share)을 다시 곱하지 않는다.
  #   값이 있으면 MPC friction 상한에서 mu_hat 대신 쓰인다 (mu_hat:= 를 줘도 안 바뀐다). 0 이하인 바퀴는 mu_hat × 하중 몫.
  #   잰 사분면 (ω·τ 부호): FL 3, FR 1, RL 3, RR 3 — 한 방향에서 잰 값을 양쪽 |τ_i| ≤ τ̄_i 에 같이 쓴다.
  #   끄기: launch mu_hat_wheels:=off.  한 번만 다른 값: mu_hat_wheels:="a,b,c,d".  시뮬 플랜트(surface_mu)에는 안 쓰인다
  mu_hat_wheels: [0.432, 0.285, 0.456, 0.350]
  c_s: 0.8                   # 안전계수

# ── 모델 스위치 — 2026-11-16 부터 시뮬 플랜트(Python TorquePlant·sim_plant_torque) 물리만 정한다.
#    제어기(torque_mpc_node)는 이 값을 안 읽는다: M 에 m_w 를 늘 넣고, w 항만 torque_mpc.yaml model_terms.use_w 로 켜고 끈다
#    (w 항·외란 추정치 지시서). 2026-11-16 사용자 결정: 시뮬 플랜트도 기본 켬 — 실차처럼 바퀴 관성이 있는 물리
#    (지시서 7.3 의 "플랜트는 w 를 포함한 식-5"). 제어기 기본(m_eq, w 끔)과는 w 항만 다르다.
#    슬립 모델(surface_mu > 0)은 바퀴를 따로 상태로 두고 J_w 를 늘 넣으므로 이 값과 상관없다.
model:
  use_wheel_inertia: true    # true 면 M_eff = diag(m+μ, m+μ, I_z+μk²), μ = 4J_w/r², 그리고
                             #   바퀴 반영 관성 항 w = M_eff⁻¹[μ ω_z S Ẋ_xy; 0] 을 넣는다 (1판 식-3~6).
                             #   false 면 10/29 방향 정리의 "휠 관성 무시" 모델: M = diag(m, m, I_z), w = 0.
  gravity: 9.81
