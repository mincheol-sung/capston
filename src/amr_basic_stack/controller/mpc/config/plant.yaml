# amr_mpc 설계 파라미터 단일 출처
# ===================================================================
# 이 파일이 모델·제약·튜닝의 유일한 출처다. model.py 와 mpc.py 가 import 시점에 읽고,
# ROS 노드는 이 값을 파라미터 기본값으로 쓴다 (mpc.yaml 로 덮어쓸 수 있다).
#
# 왜 코드에서 뺐나: 2026-09-03 까지 값이 model.py 상수, mpc.py 상수, mpc.yaml 세 곳에
#   흩어져 있었고 실제로 갈라졌다 — MPC 기본 r=(1,1,0.3) 인데 노드는 (1,1,1) 을 넘기고,
#   변화율 제약은 mpc_tracking_node 만 걸어서 자기시험은 무제약으로 돌았다.
#
# 절 구분
#   model     명령 → 응답 특성. sys_id 재피팅하면 여기만 바꾼다.
#   geometry  차체 치수. K_GEOM 과 V_LIMIT 이 여기서 파생된다.
#   limits    하드웨어 한계와 예산. 모델이 아니라 제약이다.
#   tuning    제어기 설계값. 모델·제약이 그대로여도 이건 바꿀 수 있다.
#   safety    끊김 판정 시간.
# ===================================================================

# ── 모델: 구동계 명령→응답 (FOPDT, First-Order Plus Dead Time) ──────
# 2026-09-03 지상 재식별 (wp2_log_20260903_160518, 0.5~0.7 m/s, 램프 0.3 s).
#   실제 구동계는 2차다 (ARX 극점 ω_n 11~21 rad/s, ζ 0.72~1.0, DC 1.00).
#   1차 근사는 여자 모양에 따라 τ·θ 를 맞바꾼다 (계단 τ134/θ40 ↔ 램프 τ61/θ80) —
#   그래서 theta 를 40 ms 에 고정하고 tau 만 피팅했다. tuning.Ts 와 같아야 d=1 이 된다.
#   이전 (2026-09-01, ≤0.3 m/s 계단): tau 0.1343/0.1455/0.1173, k_dc 1.0201/1.0193/1.0075
#
# ★ 재피팅 절차: controller/sys_id/ 로 로그를 뜨고 fit_fopdt.py 로 맞춘 뒤 이 세 줄만 바꾼다.
#   theta 를 바꾸면 d = theta/Ts 가 정수인지 확인해야 한다 (mpc.py 의 plant() 가 d=0,1 만 조립).
model:
  tau:   {vx: 0.098, vy: 0.106, wz: 0.089}     # 시상수 [s]
  k_dc:  {vx: 1.012, vy: 1.013, wz: 1.005}     # DC 이득 [-]
  theta: 0.040                                  # 시간 밀림 [s]

# ── 기하: 차체 치수 ──────────────────────────────────────────────
# amr_bringup/config/base.yaml 과 같아야 한다 (드라이버가 같은 값으로 역기구학을 푼다).
#   V_LIMIT = wheel_radius_m × limits.max_wheel_rad_per_sec
#   K_GEOM  = (wheel_base_m + robot_width_m) / 2      L1 부하식에서 ω 를 환산하는 팔 길이
geometry:
  wheel_radius_m: 0.04
  wheel_base_m:   0.1897
  robot_width_m:  0.207

# ── 제약: 하드웨어 한계와 예산 ───────────────────────────────────
limits:
  # base.yaml 과 같게. 2026-09-03 재식별에서 1.0 m/s 직진 추종에 보정 예산이 남는 최소값.
  #   26 은 예산 4 % 라 5.8 s/2.9 cm 잔류, 30 은 1.5 s/0. 34 이상은 실측 PWM 피크 88~92 % 에 붙는다.
  max_wheel_rad_per_sec: 30.0

  # 명령 가속도 [m/s², m/s², rad/s²] → mpc.py 의 |Δu| ≤ 이 값 × Ts (Wang Ch.2).
  #   0 이하인 축은 제약 없음. 플래너(dra_mppi.yaml limits.acceleration [2.25,2.25,6.75])의 2 배 —
  #   같게 두면 피드포워드가 예산을 다 먹어 보정 여유가 0 이 된다.
  #   MPPI→MPC→FOPDT 폐루프 시뮬(seed 8): 부드러움과 추종오차가 단조로 맞바뀐다.
  #     a_xy 제약없음 6.29 cm / 6.75 → 6.32 / 4.5 → 7.06 / 3.46 → 7.79 / 2.25 → 9.28 (예산 0, 쓰지 말 것)
  max_cmd_accel: [4.5, 4.5, 13.5]

  # 포즈오차 연성 한계 [m, m, rad] — 출력(y = X_e = 기준포즈 − 현재포즈) 의 예측값에 건다.
  #   경성으로 걸면 초기 오차가 한계 밖인 순간 QP 가 비가능해진다 (LP 로 확인: 한계 20 cm 에
  #   오차 21 cm 면 실행가능한 ΔU 가 없다 — ΔU 가 예측을 끌어당길 수 있는 범위가 입력 제약이
  #   정하는 도달집합에 갇혀 있기 때문). 그래서 스텝별 슬랙 ε_i 를 붙여 비용에 ρ·Σε_i² 로 넣는다
  #   (Maciejowski 3.4). 슬랙이 있으면 항상 실행가능하다.
  #   inf 인 축은 안 건다. yaw 는 q_yaw 가 이미 낮게 잡혀 있어 우선 열어둔다.
  #   0.30 은 figure8_reference_node 의 abort_error 0.35 m 보다 작게 — 경성 중단 전에 연성이 먼저 일한다.
  #
  # ★ 비용을 반드시 보고 켤 것. 8자 sim 동일 부하 연속 측정 (out_every=4):
  #       끔  [.inf,.inf,.inf]   오차 RMS 0.21 cm   step 평균 1.9 ms  최대 16.9 ms   QP 반복 0
  #       켬  [0.30,0.30,.inf]   오차 RMS 0.22 cm   step 평균 8.1 ms  최대 35.0 ms   QP 반복 0
  #   추종은 동일하고 QP 는 한 번도 활성화되지 않는다 — 정상 주행 오차가 1.3 cm 라 30 cm 한계에
  #   근처도 안 가기 때문이다. 즉 지금 설정에서는 **매 틱 제약을 조립하는 비용만 낸다**.
  #   값이 있는 곳은 실패 모드뿐인데, 그 corridor 는 abort_error 경성 중단이 per-tick 비용 0 으로
  #   이미 덮는다. 실차에서 폴백이 늘거나 step 이 주기를 넘기면 [.inf,.inf,.inf] 로 끄면 된다.
  #   한계를 오차 규모(수 cm)에 맞게 조이면 실제로 물리기 시작하지만, 그때부터 추종 특성이 바뀐다.
  max_pose_error: [.inf, .inf, .inf]   # ← 껐다. 근거는 위 주석 (추종 이득 0, step 3배)

  # 기준 부하 |vx|+|vy|+K_GEOM·|ω| 가 이 비율을 넘으면 경고(운용)·거부(자기시험).
  #   남는 35 % 가 되먹임 보정 몫이다. 교재 대응은 튜브 MPC 의 제약 축소율 λ
  #   (Mayne et al. 2005, Rawlings–Mayne–Diehl Ch.3) 이지만 튜브 폭을 재서 정한 값은 아니다.
  load_budget: 0.65

# ── 튜닝: 제어기 설계값 ─────────────────────────────────────────
tuning:
  Ts: 0.04      # model.theta 와 같아야 d=1 (정확히 한 스텝 지연). 드라이버 20 ms 의 정수배.
  Np: 20        # 0.8 s 지평 = 폐루프 시간상수 0.36 s 의 2.2 배
  Nc: 5         # 결정변수 3×Nc = 15
  q_pos: 6.0    # 포즈오차 x, y 가중
  q_yaw: 0.5    # 헤딩오차 가중. q_pos 의 1/12 — 급회전에서 헤딩이 뒤처지는 원인이다.
                #   8자 잎사귀 꼭대기에서 헤딩오차 최대 11.9° (위치오차는 1.2 cm).
  # QP 반복 상한. 걸리면 그때까지의 λ 로 반환하고 clip_twist 폴백이 첫 스텝의 실행가능성을
  # 보장한다 (제약 위반 0 — 아래 실측). 주기를 넘기는 것보다 폴백이 안전하다.
  #   정상 주행: 활성 자체가 0.4 % 이고 걸려도 20 회면 수렴 → 100 은 5 배 여유, 동작 동일.
  #   포화 영역: 상한을 키워도 추종이 안 나아진다. 스트레스 시뮬(초기오차 1.2 m, 기준 0.9 m/s):
  #     상한  50 / 100 / 200 / 400 / 800  →  오차 RMS 347/338/358/356/353 cm (단조성 없음)
  #                                          step 평균 4.1/5.2/7.9/8.8/12.6 ms
  #     즉 그 영역에서 반복은 순수 비용이다. 800 → 100 으로 최악 시간이 절반 이하가 된다.
  #   2026-09-03 실차 발산에서 step 최대 83 ms 로 40 ms 주기를 넘겼다 (800 회 × 부하 걸린 파이썬).
  qp_max_iter: 100

  # 출력 제약을 몇 예측 스텝마다 걸까. 1 이면 전부 (슬랙·제약행이 그만큼 늘어난다).
  out_every: 4
  # 슬랙 벌점 ρ. 비용에 ρ·Σε² 로 들어간다. 크면 한계를 더 지키려 하고, 작으면 쉽게 넘는다.
  slack_rho: 1.0e3
  # 속도 관측기 gain K (core/observer.py). v̂ = a v̂ + b u(k−1−d) + K(v_meas − v̂).
  #   1.0 = 측정 그대로 (2026-09-09 이전 동작), 0 = 순수 개루프 예측.
  #   이게 필요한 이유: incremental form 이 Δx_m 에서 v 를 1차 차분하므로 측정잡음이 √2 배로
  #   커진 채 ΔU 로 나온다. 실차 실측 (bags/mpc_chain_20260909_151007, 390~416 s):
  #   잡음 1σ vx 12.0 / vy 9.6 mm/s, wz 42.2 mrad/s → Δu 부호반전 63 %, 명령 2.48 Hz 맥동.
  #   폐루프 시뮬에서 잡음만 켜도 평균|Δvx| 가 0.0010 → 0.0256 (25 배) 로 뛴다.
  #   K 선정 근거와 저역통과 대비 우위는 core/observer.py 머리주석에 표로 있다.
  #   ★ 이걸 낮추는 대신 r_du 를 올리지 마라 — 아래 r_du 주석의 추종 악화만 산다.
  k_obs: 0.15
  r_du: 1.0     # Δu 가중. 올리면 부드럽지만 기준열을 늦게 따라간다 —
                #   폐루프 시뮬에서 4/8/16/32 가 전역경로 오차 RMS 를
                #   5.6 → 8.0 → 9.9 → 13.1 → 19.7 cm 로 단조 악화시켰다.
                #   부드러움은 limits.max_cmd_accel 로 얻는다.

# ── 안전: 끊김 판정 ─────────────────────────────────────────────
safety:
  odom_timeout: 0.3    # 상태 피드백이 이 시간 없으면 정지 [s]
  ref_timeout:  0.5    # 기준열 수신이 이 시간 없으면 정지 [s]. 플래너 10 Hz 의 5 주기.

# ── hold: 도착 후 정지 latch (core/reference.py HoldLatch, Nav2 stateful goal checker 규칙) ─────
# 플래너가 정지 기준열(속도 0, 포즈 한 점)을 내고 오차가 enter 안이면 명령 0 + MPC 리셋.
# exit 를 넘으면(밀림) 다시 추종. 2026-09-10 bags/mpc_chain_20260910_172254 근거:
#   포즈 잡음 1σ 1 mm / 0.3° → enter 는 그 10 배 (떨림 없음). exit 는 dra_mppi goal_tolerance 0.15 m 보다 작게.
#   능동 추종을 두면 몸체명령 ~10 mm/s, 바퀴 0.5~0.9 rad/s 가 stiction(≈0.25 rad/s) 근처에서 stick-slip 한다.
hold:
  enter_xy: 0.01        # [m]   이 안이면 idle 진입
  enter_yaw_deg: 2.0    # [deg]
  exit_xy: 0.03         # [m]   idle 중 이걸 넘으면 추종 재개
  exit_yaw_deg: 5.0     # [deg]
  stopped_v: 0.04       # [m/s]   odom 몸체속도 |v| 가 이 아래여야 idle 진입 (구조 A)
  stopped_w_deg: 6.0    # [deg/s] odom |ω|
