# 토크 MPC 제어기 설정 — torque_mpc_node (amr_mpc_cpp) 가 읽는다
# ===================================================================
# 로봇·노면 값(질량, 관성, μ̂, 모터 한계, 시뮬 플랜트의 바퀴 관성 스위치)은 torque_plant.yaml 에 있다.
# 여기는 "제어기를 어떻게 돌릴까" 만 둔다: 비교군 선택, 모델 항 스위치(w 항·외란 추정치), 튜닝.
# 근거: 『메카넘 토크 MPC 1판 설계』 식-8~22, 10절 설정값 표.
#
# 바꾸는 법
#   기본값 자체를 바꿀 때     → 이 파일을 고친다 (--symlink-install 빌드라 다음 launch 에 바로 반영)
#   이번 실행 한 번만 바꿀 때 → launch 인자  limit_mode:=friction  disturbance:=true
# ===================================================================

# ── 비교군 선택 (2차 발표 A/B/C 중 B·C)
torque_limit:
  mode: motor_only      # motor_only    = 비교군 B. 상한은 모터 한계만: τ̄ = τ_lim − τ_fric,max
                        # friction      = 비교군 C. τ̄ = min(τ_lim − τ_fric,max, (r/√2)·μ̂·(m g/4)·c_s)   (1판 식-21)
                        # friction_mtte = C + MTTE 온라인 보정. 아직 구현 안 함 (기동 시 거부)
  rate_fraction: 0.3333 # 변화율 상한 Δτ̄ = τ̄ × 이 값 (1판: τ̄/3 — 3 스텝 30 ms 에 상한까지)
  cap_on: ground        # 2026-11-22 friction 상한을 거는 곳. total = 바퀴 토크 |τ_i| ≤ τ̄_i (1판) | ground = 바닥 토크 |(P τ)_i| ≤ τ̄_i
                        #   2026-11-25 사용자 결정 "기본으로 넣어": 기본 ground (그 전 total). 이번 실행만: launch mpc_cap_on:=total
                        #   (P = I − J_w Fᵀ M_eff⁻¹ F, 바퀴 관성 몫 제외 — 앞 1.94 → 2.88 m/s², analysis/.../2026-11-21_line_accel/GROUND_CAP_REVIEW_KO.md).
                        #   launch 인자 mpc_cap_on:=ground
  # ── 마찰 상한 옮김 (2026-11-24, 11-23 교수님 회의 후속 지시서 T1 7단계 (B). 식은 torque_mpc.hpp 머리주석 "마찰 상한 옮김")
  #    torque_output 마찰 보상을 끈 판 (launch friction_comp:=false) 에서는 MPC 의 τ 가 모터 토크라, 구동계 마찰 f 만큼이 바닥에 안 간다.
  #    friction 상한 상자를 f 만큼 옮긴다:  −τ̄ + f ≤ τ ≤ τ̄ + f  (cap_on ground 면 바닥 토크 행을 P f 만큼).
  #    f = scale × (coulomb·tanh(ω_r/ω_s) + viscous·ω_r),  ω_r = 지평 스텝의 기준 바퀴 속도,  coulomb·viscous = torque_plant.yaml friction.
  #    false 면 예전 그대로 (f 를 계산하지도 더하지도 않는다). 보상을 켠 채 true 면 마찰을 두 번 센다 — launch 가 막는다.
  #    launch 인자 mpc_cap_friction_shift:=true (friction_comp:=false limit_mode:=friction 과 같이)
  #    2026-11-24 사용자 결정 (안정민 "둘다 키고 외란도 켜"): 기본 켬 — 주행 launch 의 마찰 보상 기본을 끄면서 같이. limit_mode friction 에서만 쓰인다.
  #    끄려면 mpc_cap_friction_shift:=false. 보상을 켠 판 (friction_comp:=true) 은 launch 가 이것과 마찰 모델을 알아서 끈다.
  friction_shift: true
  friction_shift_scale: 1.0          # f 에 곱하는 배율 (1 = 실측 마찰 그대로. 벤치 무부하 값이라 바닥 위 주행 저항은 더 클 수 있다 — 지시서 T7 1단계 뒤 조정)
  friction_shift_smooth_rad_s: 0.5   # ω_s: coulomb 항 tanh 폭 (torque_output friction_smooth_rad_s 와 같게)

# ── 예측 모델의 선형화 방식 (식은 mpc_cpp/include/amr_mpc_cpp/torque_mpc.hpp 머리주석)
#    2026-11-13 교수님 지시 "현재 스텝 기준 linearized model" 로 current_state 를 추가했다.
#    2026-11-14 결정(전준민): 기본은 reference 유지. 시뮬 비교에서 미끄러운 바닥(surface_mu 0.3) + 토크 상한 B
#    (motor_only) 조건에서 current_state 만 3/3 회 실패(5 s 만에 추종 오차 30 cm, 토크 1.3 N·m 포화, 큰 슬립).
#    상한 C(friction)에서는 두 방식 모두 완주. 원인 확인·보완 뒤 다시 비교한다 (stack_changelog 2026-11-14).
linearization:
  mode: reference       # reference     = 1판 그대로. 지평 각 스텝에 기준 방향 θ_r·기준 속도를 대입 (기준궤적 따라 LTV)
                        # current_state = 매 주기 현재 추정 상태 x̂(k)·직전 토크 τ(k−1) 에서 야코비안 선형화,
                        #                 그 한 모델을 지평 전체에 쓴다 (successive linearization)
                        # 이번 실행 한 번만 바꿀 때 → launch 인자  linearization:=current_state

# ── 모델 항 스위치 (w 항·외란 추정치 지시서, 교수님 2026-11-16: "구현하되 끈 채로 제어, 언제든 켤 수 있게")
#    바퀴 등가 질량 m_w = 4J_w/r² 는 M 에 늘 들어간다 (M = diag(m+m_w, m+m_w, I_z+m_w k²), 식-3·5).
#    use_w 는 w 항(식-6, 회전 중 m_w 가 만드는 가속도 (m_w/m_eq)·θ̇·[−ẏ, ẋ]) 만 켜고 끈다 — 예측·목표 입력·d̂ 잔차에 같이.
#    yaw 고정 경로(yaw_mode:=fixed)는 θ̇ = 0 이라 켜도 w = 0.
#    이번 실행 한 번만: launch 인자 use_w:=true|false (amrall 도 같음)
#    2026-11-20 (7) 사용자 결정: 기본 켬. R 튜닝(2026-11-20 (5)(6))을 use_w 켬으로 했다. 교수님 11-16 지시("끈 채로")와 다르니 보고할 것.
#    끈 채로 돌릴 때: use_w:=false
model_terms:
  use_w: true
  # ── 마찰 모델 (2026-11-24, 11-23 회의 후속 지시서 T11b 를 사용자 결정으로 앞당김. 식은 torque_mpc.hpp 머리주석 "마찰 모델")
  #    구동계 마찰 τ_b = scale·(coulomb·tanh(ω_r/ω_s) + viscous·ω_r) 를 기준 바퀴 속도 ω_r 로 미리 계산해
  #    목표 입력 (U_s + τ_b)·예측 (B (τ − τ_b))·외란 추정 잔차에 넣는다. 계수는 torque_plant.yaml friction, scale·ω_s 는
  #    torque_limit.friction_shift_scale·friction_shift_smooth_rad_s 를 같이 쓴다 (상한 옮김과 같은 마찰 값).
  #    torque_output 마찰 보상을 끈 판 전용 — 켠 채면 마찰을 두 번 넣는다 (launch 가 막는다). 롤러 구름 저항·정지 마찰은 없다.
  #    false 면 예전 그대로.  launch 인자 use_fric_model:=true (friction_comp:=false 와 같이, 보통 mpc_cap_friction_shift:=true 도)
  #    2026-11-24 사용자 결정: 기본 켬 (위 friction_shift 와 같이). 끄려면 use_fric_model:=false
  use_fric_model: true
  # ── 구름 손실 (2026-11-24, 정석 바퀴 식의 rolling resistance 항 f_r·N·r·sgn(ω). 식은 torque_mpc.hpp 머리주석 "마찰 모델" 끝)
  #    바닥에서 띄운 값 (torque_plant.yaml friction) 보다 더 드는, 바퀴 회전 방향을 따르는 일정 토크 [N·m, 네 바퀴 공통].
  #    ★ 메카넘 롤러가 자기 축으로 돌 때의 손실 (롤러 구름 저항, 지시서 use_rolling_res) 이 아니다 — 그 손실은 바퀴 중심에 옆 방향 속도가
  #      있을 때만 (옆걸음·대각선·회전) 생기고 직진에서는 0 이다. 이 값은 직진 등속에서 잰 것이고, 롤러 구름 저항은 모델에 없다 (미측정).
  #    use_fric_model 이 켜졌을 때 τ_b 에 더해 예측·목표 입력·외란 추정 잔차에 넣는다. 상한 옮김 (friction_shift) 에는 안 넣는다 —
  #    허용 모터 토크가 이 값과 무관하게 (2026-11-24 사용자 결정 "슬립 방지가 메인이니 보수적으로"). 구동 쪽은 값이 커도 바닥 토크가
  #    상한을 안 넘는다. ★ 제동 쪽은 실제 구름 손실만큼 상한을 넘는다 — 이 항을 넣기 전에도 그랬고 이 항으로는 안 바뀐다 (torque_mpc.hpp 머리주석).
  #    잰 값 (analysis/torque_mpc_real/2026-11-24_floor/RESULTS_KO.md, 등속 직진 12 구간 34~36 °C, 모자란 양):
  #      5 / 10 / 15 rad/s 에서 6.1 / 5.2 / 4.0 mN·m (구간별 3.1~7.0), 더 차가울 때의 띄운 값으로 빼면 평균 2.7.
  #      0.0027 은 12 구간 어디서도 넘치지 않는 값, 0.0051 은 평균 (6 구간에서 넘침). 옆걸음·가속 중은 안 쟀다.
  #    0 이면 예전 그대로. 이번 실행 한 번만: launch 인자 mpc_fric_rolling:=0.0027 (amrall 도 같음). 기본값은 실차 A/B 뒤 사용자가 정한다
  fric_rolling_Nm: 0.0
  # 2026-11-25 롤러 구름 저항 [N, 롤러 하나당] (torque_mpc.hpp 머리주석 "롤러 구름 저항"). 0 = 끔 (예전 그대로). launch mpc_roller_rr:=.
  #   옆·회전에만 걸리는 몸체 저항 (앞 0): 옆걸음 4√2 F, 제자리 회전 4√2 l_x F. 실차 식별 0.88 N (옆 4.99 N, 회전 0.43 N·m) —
  #   analysis/torque_mpc_real/2026-11-25_lat · _rot.
  #   2026-11-26 사용자 결정 "기본으로 켜기" — 실차 A/B (꺾은선 통과 3 판씩, analysis/torque_mpc_real/2026-11-25_roller_ab/RESULTS_KO.md):
  #     헤딩 RMS 2.6 → 0.97°, 출발 회전 덜 돎 2.8 → 0.46°, 회전 속도 비 0.97 → 1.00 (판 사이 폭 안 겹침), 위치 6.9 → 5.8 cm (겹침), 슬립 그대로.
  #     값 점검 (param_check.py): 회전 때 외란 추정이 배운 회전 가속 끔 −0.35 → 켬 −0.07 rad/s², 회전 중 헤딩 오차 평균 −1.59 → −0.05°.
  #   예전 동작 (끔): launch mpc_roller_rr:=0.0 mpc_inertia_z:=0.06
  roller_rr_N: 0.88
  roller_s0_mps: 0.02
  # 2026-11-26 MPC 가 믿는 몸체 회전 관성 I_z [kg·m²] — 제어기만. 없거나 ≤ 0 이면 torque_plant.yaml body.inertia_z_kgm2 (0.06, 균일판 추정).
  #   실차 회전 단계 토크 식별 I_eff 0.11~0.12 − 바퀴 몫 0.083 → 0.03 (analysis/torque_mpc_real/2026-11-25_rot). 롤러 저항과 같이 켠다 (사용자 결정 11-25·11-26).
  #   torque_plant.yaml 값은 시뮬 플랜트·기준 생성기 (fig8_limits)·단계 시험 도구가 같이 써서 그대로 둔다. launch mpc_inertia_z:= 가 이 값을 덮는다
  inertia_z_kgm2: 0.03

# ── 하중 이동 (2026-11-23, torque_mpc.hpp TorqueTuning load_*). com_height_m 0 = 끔 (예전 동작).
#    실차 계단 변조 8자 (151038): 선회 원심 가속이 클수록 안쪽 바퀴가 미끄러졌다 (a_y 2.2~3.5 에서 안쪽 앞 끌림 40 %·안쪽 뒤 헛돎 66 %).
#    최소 노름 배분이 가벼워진 안쪽 앞바퀴에 제동 토크를 줬다 → 기준 가속도로 바퀴별 수직력 N_i 를 내어 배분 가중·스텝별 friction 상한에 쓴다.
#    N_i = 몫_i m g − s_x m a_x h/(2L) − s_y m a_y h/(2W).  h 실측 없음 — URDF 차체 관성 원점 0.04 + 0.065 = 0.105 m. launch mpc_com_height:=0.105
load_transfer:
  com_height_m: 0.0
  min_frac: 0.2          # N_i 아래 한계 (× 정지 하중)
  weighted_alloc: true   # U_s = argmin Σ (τ_i / τ̄_i(N))² — 마찰 사용률 고르게
  dynamic_cap: true      # friction 상한 τ̄_i × N_i / N_i,0 (지평 스텝마다)

# ── 슬립 계수 η_s (2026-11-23 교수님 회의 "η 토크 상한", 선택 기능. 식은 torque_mpc.hpp 머리주석 "슬립 계수 η_s")
#    바퀴별 상한 τ̄_i 에 η_s,i = 1/(1 + exp((|λ̃_i| − lambda_c)/s)) 를 곱한다. λ̃ = slip_logger 와 같은 λ 의 1 차 LPF.
#    값 (사용자 결정 2026-11-23, analysis/torque_mpc_real/2026-11-23_slip_lpf/RESULTS_KO.md 5~7 절):
#      10·15·20 % — η 0.95 at 0.10, 0.5 at 0.15, 0.05 at 0.20. 실차 μ–λ 곡선이 λ̃ 0.125~0.175 에서 꺾이고
#      평형 슬립 (상한에 붙을 때) 이 0.14~0.17 로 그 위에 온다. ω_ε 는 slip_logger 와 같은 2.5 고정 (사용자 결정).
#    꺼도 λ̃·η_s 는 계산해 /torque_mpc/slip 에 낸다 (켬/끔 판을 같은 지표로 견주려고).
#    켤 때 회의 결정대로 마찰 상한을 μ_max 1.0 으로 푼다: launch slip_eta:=true mu_hat_wheels:=off mu_hat:=1.0
slip_eta:
  enable: false
  lambda_c: 0.15         # η_s = 0.5 인 |λ̃|
  s: 0.017               # logistic 폭 — 0.95 → 0.05 구간 = 2·ln19·s = 0.10
  fc_hz: 10.0            # λ LPF 차단 주파수 (τ 15.9 ms)
  omega_eps: 2.5         # [rad/s] λ 분모 아래 한계 (slip_logger omega_eps 와 같게)
  weighted_alloc: true   # η_s < 1 인 바퀴가 있으면 목표 입력 U_s 를 min Σ (τ_i / (c_i η_s,i))² 로 배분 (나머지 바퀴로)
  alloc_floor: 0.05      # 그 가중에서 η_s 아래 한계 (두 바퀴가 0 이면 F W⁻¹ Fᵀ 가 특이)

# ── 외란 추정치 d̂ (적분 작용, 1판 식-9~11).  2026-11-10 결정: 기본 끔 (노미널 MPC)
#    꺼도 d̂ 는 계산해서 로그·status 에 남긴다 — "모델이 어디서 틀렸나" 기록용. 예측에 더하지만 않는다.
# ── 슬립 되먹임 (2026-11-27, 2026-11-28 부터 기본 켬) — MPC 풀이 뒤 바깥 회로에서  τ = τ_MPC − K_ω (ω − ω_nom)     ((3) 부터 바퀴 공간)
#   ω     = 바퀴 속도 [FL, FR, RL, RR] rad/s (/wheel_states)
#   ω_nom = T⁻¹ R(δ0)ᵀ x_e — 추정기 몸체 속도 x_e = [v_x, v_y, ω_z] 가 시키는 무슬립 바퀴 속도 (구동계 방향 δ0 만, 선회 미끄럼 보정은 안 함)
#   e_ω = ω − ω_nom 은 바퀴마다의 미끄럼. 바퀴가 무슬립 속도보다 빨리 돌면 (헛돎) 그 바퀴 토크를 줄이고, 느리면 (끌림) 늘린다.
#   K_ω (4×4) 는 노드가 기동할 때 계산해 로그에 찍는다 (amr_mpc_cpp slip_feedback_gain, 식은 torque_mpc.hpp 주석):
#     gain: lqr — 바퀴 미끄럼 모델 J_w ω̇ = τ − τ_g, M_b v̇ = Jᵀ τ_g, τ_g = C e_ω 의 이산 LQR (Ts 0.01, ZOH)
#                 비용 Σ q_slip ‖r e_ω‖² + r_dtau ‖Δτ‖². grip_speed_mps 0 = 바닥 힘이 포화된 "미끄러지는 중" (C = 0) → 대각
#                 (지금 값: 0.0162 N·m/(rad/s), 닫힌 고리 시정수 50 ms). > 0 이면 그 속도에서 붙어 구르는 모델 → 몸체를 거쳐 엮인 4×4
#     gain: ik  — K_ω = K_v R(δ0) T, K_v = 무제약 MPC 이득의 속도 열 (unconstrained_gain). 예전 (2026-11-27 (2)) 몸체 오차 되먹임
#                 −K_v (R(δ0)Tω − x_e) 와 Δτ 가 똑같다 (rank 3, 앞·뒤 쌍 [1, 1, −1, −1] 방향 미끄럼에 0). 실차 대각 0.0043
#   MPC 안 (τ_prev·d̂·제약) 은 τ_MPC 만 알고, 낸 명령은 ± 모터 한계로만 자른다 (Δτ 에 friction 상한 안 건다).
#   꺼져 있어도 e_ω·Δτ 는 계산해 /torque_mpc/slip_fb (맨 뒤 4 열) 와 CSV (sfb_ew_*) 에 남긴다.
#   launch 인자 slip_fb:=true|false slip_fb_scale:=0.25 slip_fb_gain:=lqr|ik  (이번 실행만 끌 때: slip_fb:=false)
#   ★ lqr 배율 1 을 11-27 실차 r2·r3 bag (motor_only) 의 e_ω 에 대 보면 Δτ RMS 0.05~0.14 N·m, 최대 0.84 (바닥 상한 0.08 의 몇 배).
#     그 뒤 friction 에서 배율 1.0~1.5 를 실제로 켜고 돌린 판 (아래 gain_scale 주석) 은 떨림·발산 없이 끝까지 갔다.
slip_feedback:
  enable: true          # 2026-11-28 사용자 결정 "true 로 바꿔": 11-27 Q 튜닝 (tuning.W [80, 80, 10, 2, 2, 1]) 을 이 되먹임 (lqr, 배율 1.0) 을 켠 채로 했으므로
                        #   기본값도 그 조합으로. (이전: false — 2026-11-27 (2) 도입 때 "기본 끔")
  gain_scale: 1.0       # K_ω 에 곱하는 배율 (0 ~ 5). lqr 대각 0.0162 N·m/(rad/s). 2026-11-27 실차 (friction · circles8 width 2.0 · blend 0):
                        #   ① 1.0 m/s · accel 1.0, 배율 1.0~1.5 19 판: > 50 % 슬립 시간은 배율과 무관 (p 0.32), 미끄럼 속도 r·e_ω RMS 13.1→11.2 cm/s,
                        #      위치 RMS 9.7→12.8 cm → 한때 1.4 로 (11-27 (4)).
                        #   ② 0.8 m/s · accel 1.0 (원이 마찰 상한 안, Q 튜닝 시나리오), 1.4 vs 1.0 각 3 판: 슬립 같거나 1.0 이 적음
                        #      (> 50 % 1.9→0.6 %, 미끄럼 속도 8.9→8.6, 둘 다 p > 0.18), 위치 RMS 4.7→3.3 cm (p 0.055), 보정 토크 51→35 mN·m
                        #      → 사용자 결정 "슬립이 덜 발생하는 조합으로" 1.0 (11-27 (5))
  gain: lqr             # lqr | ik
  q_slip: 2.0           # [(m/s)⁻²] 미끄럼 속도 r e_ω 무게 — MPC 속도 무게 q_ẋ 와 같은 값에서 시작
  r_dtau: 10.0          # [(N·m)⁻²] Δτ 무게 — MPC 입력 편차 무게 r_U 와 같은 값에서 시작
  grip_speed_mps: 0.0   # 0 = 미끄러지는 중 모델 (대각). > 0 = 이 속도에서 붙어 구르는 모델 (엮인 4×4, 이득이 작아진다)
  mu_slope: 1.26        # 붙어 구르는 모델의 μ–λ 첫 기울기 (analysis/torque_mpc_real/2026-11-23_slip_lpf 5 절)

disturbance:
  enable: true          # 2026-11-24 사용자 결정 (안정민 "둘다 키고 외란도 켜"): 기본 켬. ★ 교수님 11-16 지시 ("구현하되 끈 채로") 와 다르니 보고할 것.
                        #   이번 실행만 끌 때: launch 인자 disturbance:=false.
                        #   (이전: false — 2026-11-16 교수님 지시 (w 항·외란 추정치 지시서), 같은 날 앞선 "구현 지시서 3.7 대로 켬" 을 되돌린 값)
  alpha: 0.01           # 저역통과 d̂_f = (1−α) d̂_f + α d̂.  1 = 필터 없음, 0.1 = 시정수 0.1 s, 0.01 = 1 s
                        # 2026-11-16: 지시서 시작값 1 → 0.1 (지시서 7.4절 3안 "떨리면 0.1까지"). 시뮬 8자 B: α 1 은 â_d = d̂_ṗ/Ts 가
                        # 추정기 속도 잡음을 100 배 키워 최대 7.7 m/s², 틱간 Δτ RMS 0.093 → 0.322·|τ|max 1.0. α 0.1 이면 0.101·0.51 (끈 것과 비슷)
                        # 2026-11-21: 0.1 → 0.01 (frame body 와 같이). 실차 8자 (analysis/torque_mpc_real/2026-11-21_square/ 14 절): α 0.1 은 흔들림
                        #   (곡률 중심 쪽 â_d 표준편차 0.18~0.51 m/s²) 이 정상상태 몫 (0.09~0.26) 의 2~5 배 → Δτ +47 %. 몸체 좌표에서 시정수 1 s 면
                        #   평균은 남고 (+0.16 → +0.13) 흔들림 1/4. 월드 좌표에서 0.01 이면 원 위에서 평균까지 지워진다 (+0.16 → +0.06) — frame 과 같이 바꿀 것
  dt_tol: 0.002         # [s] 상태 간격이 Ts ± 이 값을 벗어난 주기는 d̂ 갱신을 건너뛴다 (지시서 4절)
  skip_xy: 0.001        # [m] 잔차 위치 성분이 이보다 크면(SLAM 보정 계단) 건너뛴다 (지시서 7.4절 2안)
  accel_only: true      # 2026-11-18 시험용: true 면 위치 잔차를 버리고 ½Ts·속도 잔차로 (가속도 외란 모델, torque_mpc.hpp 머리주석).
                        #   launch 인자 mpc_dist_accel_only:=true. 기본은 1판 식-9 그대로
                        #   2026-11-21: false → true. 실차 8자에서 위치 잔차 × 50 스텝이 1~4 mm 뿐 — 입력 (가속도) 외란 모델만 남긴다
  frame: body           # 2026-11-21: world (1판) | body — 잔차 x·y 를 몸체 좌표로 돌려 거르고, 쓸 때 지평 스텝마다 R(θ_r,j) 로 (머리주석).
                        #   launch 인자 mpc_dist_frame:=world 로 예전 동작
  freeze_on_saturation: true   # 2026-11-21: 직전 τ 가 0.98 τ̄ 에 붙었거나 U_s 가 τ̄ 밖이면 갱신 멈춤 (anti-windup). 실차 8자 랩 3 (구심 2.13 m/s² >
                               #   C 상한 1.63) 에서 d̂ 가 못 따라가는 몫을 배워 포화 22 → 30 %, e_c +44 → +62 mm 였다
  acc_max: 0.5          # [m/s²] |â_d,xy| 상한. 실차 8자 정상상태 몫 0.09~0.26, 필요한 보정 (e_c × k_p) 0.16~0.34
  yaw_acc_max: 2.0      # [rad/s²] |α_d| 상한. 실차 8자 α 0.1 일 때 표준편차 3.0~3.3 rad/s² (몸체·월드 같음 — 스칼라)
  observer: lpf         # 2026-11-21: lpf (위 alpha, 식-11 = L_d = αI 인 Luenberger 관측기) | kalman (축별 정상상태 Kalman 이득,
                        #   torque_mpc.hpp 머리주석 "외란 관측기 이득"). launch 인자 mpc_dist_observer:=kalman.
                        #   kalman 이면 alpha·accel_only 는 안 쓰고 위치·속도 잔차를 아래 잡음 비로 섞는다. 아래 값의 이득:
                        #   등가 α = K·H  x 0.0175 · y 0.0103 · θ 0.0111 (시정수 0.57 · 0.97 · 0.90 s) — 손으로 고른 α 0.01 과 비슷 (RESULTS 19 절)
  kalman_q: [0.3, 0.3, 0.8]                # [m/s²/√s, rad/s²/√s] 외란 가속도 random walk 세기 — 설계값 (1 s 에 1σ 이만큼 변한다고 본다)
  kalman_r_pos: [1.6e-3, 1.6e-3, 8.7e-4]   # [m, rad] 한 스텝 위치 잔차 표준편차 — 실차 8자 212502 (몸체 x·y 1.55·1.47 mm, θ 0.044°) 를 올림
  kalman_r_vel: [0.017, 0.029, 0.079]      # [m/s, rad/s] 한 스텝 속도 잔차 표준편차 — 같은 bag (15.8·27.3 mm/s, ω 4.46°/s)

# ── 목표 입력·구심 feedforward (2026-11-21 offset-free 정석화, torque_mpc.hpp 머리주석, RESULTS 19·20 절). 모두 끈 채 = 예전 동작
feedforward:
  target_projection: false   # U_s 를 바퀴별 [−τ̄, τ̄] 에 자른다 (target calculation 의 상자 사영, Muske & Rawlings 1993).
                             #   launch 인자 mpc_target_projection:=true
  normal_scale: 1.0          # ρ 고정값 (1 = 1판). 곡률 중심 쪽 구심 몫의 (1 − ρ) 를 모델 밖 안쪽 힘으로 U_s 와 예측에 같이 넣는다.
                             #   launch 인자 mpc_ff_normal_scale:=0.9
  normal_estimate: false     # ρ 를 d̂ 와 한 Kalman 필터로 추정 (disturbance.observer kalman·frame body 필요). launch 인자 mpc_ff_normal_estimate:=true
                             #   실차 8자 bag 잔차 (RESULTS 20 절): batch LS ρ 0.90~0.93 (η ± 0.10), 결합 Kalman 재생 ρ̂ 0.88~0.97 (20~33 s 로는 덜 수렴),
                             #   몸체 d_y +0.07~0.10 m/s² — 구심 어긋남은 작고 몸체 왼쪽 일정 몫이 크다. 8자 안쪽 치우침은 일부만 줄 것으로 본다
  normal_q: 0.03             # [1/√s] η = 1 − ρ 의 random walk 세기. 실차 재생에서 뒤쪽 절반 흔들림 ±0.03 (0.1 이면 ±0.06)
  normal_min: 0.4            # ρ 하한·상한
  normal_max: 1.2
  normal_P0: 0.04            # η 초기 분산 (σ 0.2). 분산 상한은 이 값의 10 배
  normal_x_min: 0.3          # [N] 이보다 작은 구심 feedforward (직선·저속) 에서는 η 를 안 본다

# ── 상태 입력 (2026-11-18): MPC 상태의 속도 성분 출처. torque_mpc_node 머리주석
#    실차 bag 2026-11-18 (175240·175112·170819): 추정기 v_x 가 바퀴 기구학보다 +90~120 ms 늦음 (상호상관 r 0.98),
#    추정기 ω_z 는 자이로와 0 ms, SLAM 포즈는 −50~+50 ms. 지금 Q 는 등가 k_d/k_p 1.18 s 라 속도 지연에 약하다
#    (등가 PD 근사에서 0.10 s → ζ 0.08, 0.12 s → 불안정). 퓨어 퍼슛(A)은 속도 루프를 엔코더로 닫는다.
state_input:
  velocity_source: estimator   # estimator | wheels (v_x·v_y = 바퀴 T ω, ω_z 는 추정기). launch 인자 velocity_source:=wheels
  wheel_timeout: 0.05          # [s] 바퀴 상태가 이보다 묵으면 그 주기는 추정기 속도

# ── 튜닝 (1판 10절 시작값)
tuning:
  Ts: 0.01              # [s] 상태 추정값 주기와 같아야 한다 (노드는 상태 메시지가 올 때마다 한 번 푼다)
  Np: 75                # 예측 지평 0.75 s. launch 인자 mpc_Np. 2026-11-23 (4): 50 → 75 (사용자 결정, Nc 25 → 40 과 같이)
                        #   근거 analysis/torque_mpc_sim/2026-11-23_horizon/RESULTS_KO.md: 무한 지평 LQ 지배 시정수 0.355 s → 계산상 Np ≈ 100 (×3),
                        #   Nc ≥ Np/2 아니면 긴 Np 가 더 나쁨. 시뮬 스택 8자 (R 0.3, 두 판씩) 50/25 → 75/40 시간 추종 RMS 25 → 21.6 mm (d̂ 켬) · 26.4 → 21.4 (끔),
                        #   100/50 은 더 안 나아지고 계산 99 % 6.5~7 ms. 75/40 계산 평균 1.5 ms · 최대 ~5 ms (NUC). 예전 값: mpc_Np:=50 mpc_Nc:=25 (11-23 (2)) · mpc_Nc:=5 (그 전)
  Nc: 40                # 제어 지평. 이후 토크는 마지막 값 유지 (move blocking). 11-23 (2) 5 → 25, (4) 25 → 40
                        # 2026-11-23: 5 → 25 (사용자 결정). Nc 5 는 지평 0.5 s 안의 곡률 전환 (8자 교차점) 을 예측이 표현 못 해 안쪽 치우침.
                        #   이상 플랜트 8자 R 0.3: +5.3 / +10.5 mm (v 0.61 / 0.80) → +0.6 / +1.4.  시뮬 현실 조건 (추정기·μ 0.45·C·d̂, 두 판씩):
                        #   시간 추종 RMS 32 → 24 mm, Δτ RMS 0.0065~0.0071 → 0.0054~0.0058, 공통 안쪽 s 랩 1/2/3 +10.2/+10.6/+30.4 → +2.6/+3.5/+18.5 mm.
                        #   계산 평균 0.05 → 0.6 ms (NUC, 최대 1~2 ms, 시뮬 두 판 동시로 밀린 한 판 12.6 ms). analysis/torque_mpc_sim/2026-11-23_nc25/
                        #   11-23 전 C 실차 기록은 모두 Nc 5 — 비교할 때 같은 값인지 볼 것
  # ── 2026-11-12 잠정 튜닝 (추정기 잡음 대응). 1판 값은 W 속도 [1.0, 1.0, 0.5], w_delta 0.01
  #   이유: 추정기 잡음(주로 IMU 가속도 진동)이 속도 추정값을 통해 토크로 그대로 가서, 잡음만으로 토크가 최대 1.0 N·m
  #   (필요한 것은 약 0.06) 튀고 틱마다 0.13 N·m 씩 떨었다. 실차 첫 주행에서 바퀴가 헛돌 위험.
  #   시뮬(3 × 1.5 m 8자 0.5 m/s, 잡음 1배, 참값 기준 — stack_changelog 2026-11-12):
  #     | W 속도 배율 | w_delta | 추종 RMS | 최대 τ | 틱간 Δτ RMS |
  #     | 1 (1판)     | 0.01    | 13.5 mm  | 1.03   | 0.127       |
  #     | 0.3         | 3       | 12.7 mm  | 0.26   | 0.023       |
  #     | 0.1 (지금)  | 10      | 13.3 mm  | 0.15   | 0.013       |
  #   추종 오차는 어느 값에서나 11~14 mm(추정기 잡음이 바닥)라 토크 떨림·최대 토크가 가장 작은 쪽을 골랐다.
  #   적재 5 kg 을 제어기가 몰라도 13.9 mm 로 버틴다. C(μ 0.3)는 상한이 지배해 거의 그대로(λ RMS 0.074).
  #   한계: μ 0.3 에서 B 는 어떤 값으로도 이탈한다(잡음 토크가 마찰 한계 0.083 N·m 를 넘으면 B 는 멈출 장치가 없다).
  # ★ 최종값은 AK40 장착 뒤 IMU 진동 잡음을 다시 재고 정한다 (torque_mpc_todo.md "칼만 없이 이번 학기에 할 것").
  # ── 2026-11-16: 구현 지시서(amr/자료/torque_mpc_v1_implementation.md 5.6절)대로 되돌림 + 입력 편차 항 추가.
  #   실차 5-3(옆·대각·회전)에서 앞뒤 진동 — 위 잠정값은 속도 가중이 위치의 1/1000 이라 감쇠가 거의 없었다.
  #   위 표의 "1 (1판)" 행이 이 값이다 (그때는 입력 편차 항 없이). 예전 값: W 속도 [0.1, 0.1, 0.05], w_delta 10, q_null 0.01
  # ── 2026-11-17: 비교군 A(퓨어 퍼슛 + 바퀴 PI) closed-loop pole 근처로 낮춤 (사용자 결정, 상세 튜닝은 이후 실차).
  #   무제약·직선 v_r 0.5 선형화, 이 파일의 W·w_delta·r_u 로 계산한 closed-loop pole [1/s]:
  #     | 축 | A (PP + wheel P)          | 예전 W [100,100,50,1,1,0.5], r_U 0.01 | 지금 W, r_U 1        |
  #     | x  | −1.11, −10.5              | −6.96, −15.7 ± 14.7j                 | −0.97, −9.6, −32.3   |
  #     | y  | −1.58 ± 2.49j (θ 와 결합) | −6.96, −15.7 ± 14.7j                 | −0.97, −9.6, −32.3   |
  #     | θ  | −15.2 ± 3.1j  (y 와 결합) | −6.63, −42.7 ± 34.4j                 | −0.99, −44.8 ± 33.1j |
  #   등가 가속도 이득 (k_p [1/s²], k_d [1/s]): x·y 26.7·5.6 → 2.4·2.8,  θ 127·22.8 → 19.6·20.4.
  #   r_U 를 0.01 → 1 로 올린 것이 핵심 — w_Δ/r_U 가 1000 이면 θ 를 PP 만큼 빠르게 할 수 없었다 (≲ 10 이어야).
  #   영공간 토크 pole 은 −0.5 → −28.9 (r_U 가 감쇠시킨다). 계산: K_x = [H⁻¹ΦᵀW̄Λ]₁:₄, K_τ = w_Δ[H⁻¹]₁:₄,₁:₄ 의 증강 closed loop.
  # ── 2026-11-18: 위 표의 W 변경 대신 W 는 원래값 그대로 두고 입력 가중치(w_delta·r_u)만으로 A 의 pole 에 맞춤 (사용자 지시).
  #   같은 방법(무제약, θ_r = 0 직선, m_w 포함)으로 W [100,100,50,1,1,0.5] 고정, w_delta·r_u 격자(10⁰~10⁶ × 10⁻²~10⁴) 탐색:
  #     | 축       | A (PP + wheel P)          | 예전 wΔ 10, rU 0.01   | wΔ 1e4, rU 100 (검토) | 지금 wΔ 400, rU 25        |
  #     | x·y      | x −1.11 / y −1.58 ± 2.49j | −6.96, −15.7 ± 14.7j | −1.46 ± 2.68j          | −1.66 ± 2.64j (ζ 0.53)     |
  #     | θ        | −15.2 ± 3.1j              | −6.63, −42.7 ± 34.4j | −2.76 ± 3.21j (5배 느림) | −10.65, −17.0 ± 1.95j      |
  #     | 영공간    |                           | −0.50                | −4.61                  | −21.1                      |
