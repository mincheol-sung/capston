# 토크 MPC 제어기 설정 — torque_mpc_node (amr_mpc_cpp) 가 읽는다
# ===================================================================
# 로봇·노면 값(질량, 관성, μ̂, 모터 한계, 바퀴 관성 스위치)은 torque_plant.yaml 에 있다.
# 여기는 "제어기를 어떻게 돌릴까" 만 둔다: 비교군 선택, 외란 추정치 스위치, 튜닝.
# 근거: 『메카넘 토크 MPC 1판 설계』 식-8~22, 10절 설정값 표.
#
# 바꾸는 법
#   기본값 자체를 바꿀 때     → 이 파일을 고친다 (--symlink-install 빌드라 다음 launch 에 바로 반영)
#   이번 실행 한 번만 바꿀 때 → launch 인자  limit_mode:=friction  disturbance:=true
# ===================================================================

# ── 비교군 선택 (2차 발표 A/B/C 중 B·C)
torque_limit:
  mode: motor_only      # motor_only    = 비교군 B. 상한은 모터 한계만: τ̄ = τ_lim − τ_fric,max
                        # friction      = 비교군 C. τ̄ = min(τ_lim − τ_fric,max, (r/√2)·μ̂·(m g/4)·c_s)   (1판 식-21)
                        # friction_mtte = C + MTTE 온라인 보정. 아직 구현 안 함 (기동 시 거부)
  rate_fraction: 0.3333 # 변화율 상한 Δτ̄ = τ̄ × 이 값 (1판: τ̄/3 — 3 스텝 30 ms 에 상한까지)

# ── 예측 모델의 선형화 방식 (식은 mpc_cpp/include/amr_mpc_cpp/torque_mpc.hpp 머리주석)
#    2026-11-13 교수님 지시 "현재 스텝 기준 linearized model" 로 current_state 를 추가했다.
#    2026-11-14 결정(전준민): 기본은 reference 유지. 시뮬 비교에서 미끄러운 바닥(surface_mu 0.3) + 토크 상한 B
#    (motor_only) 조건에서 current_state 만 3/3 회 실패(5 s 만에 추종 오차 30 cm, 토크 1.3 N·m 포화, 큰 슬립).
#    상한 C(friction)에서는 두 방식 모두 완주. 원인 확인·보완 뒤 다시 비교한다 (stack_changelog 2026-11-14).
linearization:
  mode: reference       # reference     = 1판 그대로. 지평 각 스텝에 기준 방향 θ_r·기준 속도를 대입 (기준궤적 따라 LTV)
                        # current_state = 매 주기 현재 추정 상태 x̂(k)·직전 토크 τ(k−1) 에서 야코비안 선형화,
                        #                 그 한 모델을 지평 전체에 쓴다 (successive linearization)
                        # 이번 실행 한 번만 바꿀 때 → launch 인자  linearization:=current_state

# ── 외란 추정치 d̂ (적분 작용, 1판 식-9~11).  2026-11-10 결정: 기본 끔 (노미널 MPC)
#    꺼도 d̂ 는 계산해서 로그·status 에 남긴다 — "모델이 어디서 틀렸나" 기록용. 예측에 더하지만 않는다.
disturbance:
  enable: false
  alpha: 1.0            # 저역통과 d̂_f = (1−α) d̂_f + α d̂.  1 = 필터 없음, 0.1 = 시정수 0.1 s

# ── 튜닝 (1판 10절 시작값)
tuning:
  Ts: 0.01              # [s] 상태 추정값 주기와 같아야 한다 (노드는 상태 메시지가 올 때마다 한 번 푼다)
  Np: 50                # 예측 지평 0.5 s
  Nc: 5                 # 제어 지평. 이후 토크는 마지막 값 유지
  # ── 2026-11-12 잠정 튜닝 (추정기 잡음 대응). 1판 값은 W 속도 [1.0, 1.0, 0.5], w_delta 0.01
  #   이유: 추정기 잡음(주로 IMU 가속도 진동)이 속도 추정값을 통해 토크로 그대로 가서, 잡음만으로 토크가 최대 1.0 N·m
  #   (필요한 것은 약 0.06) 튀고 틱마다 0.13 N·m 씩 떨었다. 실차 첫 주행에서 바퀴가 헛돌 위험.
  #   시뮬(3 × 1.5 m 8자 0.5 m/s, 잡음 1배, 참값 기준 — stack_changelog 2026-11-12):
  #     | W 속도 배율 | w_delta | 추종 RMS | 최대 τ | 틱간 Δτ RMS |
  #     | 1 (1판)     | 0.01    | 13.5 mm  | 1.03   | 0.127       |
  #     | 0.3         | 3       | 12.7 mm  | 0.26   | 0.023       |
  #     | 0.1 (지금)  | 10      | 13.3 mm  | 0.15   | 0.013       |
  #   추종 오차는 어느 값에서나 11~14 mm(추정기 잡음이 바닥)라 토크 떨림·최대 토크가 가장 작은 쪽을 골랐다.
  #   적재 5 kg 을 제어기가 몰라도 13.9 mm 로 버틴다. C(μ 0.3)는 상한이 지배해 거의 그대로(λ RMS 0.074).
  #   한계: μ 0.3 에서 B 는 어떤 값으로도 이탈한다(잡음 토크가 마찰 한계 0.083 N·m 를 넘으면 B 는 멈출 장치가 없다).
  # ★ 최종값은 AK40 장착 뒤 IMU 진동 잡음을 다시 재고 정한다 (torque_mpc_todo.md "칼만 없이 이번 학기에 할 것").
  W: [100.0, 100.0, 50.0, 0.1, 0.1, 0.05]   # [x, y, θ, ẋ, ẏ, θ̇]. 위치·방향은 1판 그대로 (1 cm ≈ 1.4°)
  w_delta: 10.0         # 토크 변화 벌점 [(N·m)⁻²]. 토크가 떨리면 올린다
  q_null: 0.01          # 영공간(앞뒤가 서로 미는 조합) 벌점
  daqp_iter_limit: 1000

safety:
  state_timeout: 0.3    # [s] 상태 추정값이 이만큼 끊기면 DAMPING
  ref_timeout: 0.5      # [s] 기준열이 이만큼 끊기면 DAMPING

# ── hold: 플래너가 정지 기준열을 내고 오차가 enter 안이면 DAMPING + MPC 리셋 (plant_wheel.yaml hold 와 같은 규칙)
hold:
  enter_xy: 0.01        # [m]
  enter_yaw_deg: 2.0
  exit_xy: 0.03
  exit_yaw_deg: 5.0
  stopped_speed: 0.04   # [m/s] 몸체 속도가 이 아래여야 hold 진입
