# 토크 MPC 실험 트랙 — 8자 위치·모양·속도 (figure8_reference_node, torque_experiment.launch.py 가 읽는다)
# ===================================================================
# 2026-11-11 결정: 8자를 지도(map)에 고정한다. 노면을 바꿔 가며 B·C 를 비교하려면 8자가 매번 바닥의 같은 자리를
# 지나야 한다 (로봇 기준이면 로봇을 10 cm 옮겨 놓으면 8자 전체가 10 cm 옮겨진다).
#
# 출발: 로봇을 출발점(8자 교차점, 아래 origin) 근처에 origin_yaw_deg 방향으로 놓고 'a'.
#   - 출발점에서 start_tolerance 안이면: 로봇이 있는 곳에서 출발점까지 천천히 들어가는 진입 구간 뒤 8자 시작
#   - 밖이면: 출발을 거부하고 아무 기준도 내지 않는다 (로봇은 DAMPING 으로 서 있다). 옮겨 놓고 다시 'a'
#
# ★ origin 은 아직 임시값이다. 실제 트랙을 smoc_lab 지도 위에 정하고(To do 2절 "8자 트랙 공간")
#   교차점의 지도 좌표와 방향을 재서 넣는다. 바닥에는 출발점과 방향을 테이프로 표시한다.
# 실행 한 번만 바꿀 때는 launch 인자로 덮어쓴다:  origin_x:=1.2 speed:=0.8  (인자 이름 = 아래 키 이름)
# ===================================================================
track:
  origin_mode: fixed      # fixed = 아래 지도 좌표에 고정 | robot = 무장한 순간의 로봇 포즈가 교차점 (예전 방식)
  origin_x: 0.0           # [m]   map 좌표. 임시 (시뮬 플랜트 기동 포즈와 같게)
  origin_y: 0.0           # [m]
  origin_yaw_deg: 0.0     # [deg] 8자 가로축(width) 방향
  start_tolerance_xy: 0.30        # [m]   출발점에서 이보다 멀면 출발 거부
  start_tolerance_yaw_deg: 30.0   # [deg]
  lead_speed: 0.10        # [m/s]   진입 구간 평균 속도 상한 (스무스스텝이라 최고는 1.5 배)
  lead_yaw_rate: 0.5      # [rad/s] 진입 구간 평균 회전 속도 상한

  # 8자 모양 (Gerono 렘니스케이트, core/figure8.py). 임시값 — 실제 공간을 잰 뒤 정한다
  width: 3.0              # [m] 경계상자 가로
  height: 1.5             # [m] 경계상자 세로. 곡률을 정한다 (최소 곡률반경 ≈ W²/(16H))
  yaw_mode: tangent       # tangent = 접선 방향 주행 | fixed = 헤딩 고정 게걸음 | spin = 경로와 따로 헤딩 회전 (MPC 만, 2026-11-19)
  spin_rate: 1.0          # [rad/s] spin 순항 요레이트. 끝에서 출발 헤딩으로 오게 정수 바퀴로 맞춘다 (실제 값은 기동 로그)

  # 속도 (잠정. 모터 무부하 속도 실측 뒤 확정 — torque_mpc_todo.md "속도 프로파일")
  speed: 0.5              # [m/s] 순항 접선 속도
  accel: 0.4              # [m/s²]
  laps: 1.0
  # 랩별 순항 속도 [m/s]. 비우면([]) 위 speed·laps 하나로. 주면 laps = 목록 길이이고 speed 는 쓰지 않는다.
  # 계획(잠정): 30 m 8자에서 [0.5, 1.0, 1.5] — 모터 무부하 속도 실측 뒤 확정. 지금 임시 트랙(3 × 1.5 m, 최소 곡률반경
  # 0.31 m)은 작아서 그 속도면 기준 부하 검사에서 거부된다. 실제 트랙 크기를 정한 뒤 넣는다.
  lap_speeds: []
  align_s: 1.5            # [s] tangent 모드 앞뒤 제자리 회전
  speed_mod_amp: 0.0      # 순항 속도 sin 변조 진폭 ε (0 = 등속). v = speed·(1 + ε·sin(2π·n·σ/ℓ_lap)), 최고 speed·(1+ε) 가 부하 검사에 들어감. 2026-11-20
  speed_mod_cycles: 2.0   # 랩당 주기 수 n (circles8 에서 2 = 원 하나에 한 주기)
  speed_mod_shape: sin    # sin | square (두 속도 V(1±ε) 계단, 바뀌는 곳은 accel 로 가감속). 2026-11-22
  speed_mod_phase_deg: 0.0  # 변조 위상 φ [deg]: v = speed·(1 + ε·sin(2πnσ/ℓ_lap + φ)). −90 = 출발·교차점이 가장 느림 (n 짝수). 2026-11-22
  crossing_blend_m: 0.0   # [m] circles8 + tangent 교차점 헤딩 완화 (0 = 끔). 요 가속 최대 2v²/(R·Lb), 헤딩 최대 Lb/(4R) 덜 돔.
                          #   예 R 0.5: v 0.7 → 0.2 (9.8 rad/s², 5.7°), v 0.4 → 0.1 (6.4 rad/s², 2.9°). 2026-11-16
  start_delay: 3.0        # [s] 무장 뒤 출발까지 최소 대기 (진입 구간이 더 길면 그 시간)
  abort_error: 1.6        # [m] 기준에서 이만큼 벗어나면 기준 발행을 끊는다 → MPC 정지. fault_monitor max_track_error(1.5)보다 뒤에.
                          #     2026-11-16 0.35 → 1.6: C 가 한계 넘는 기준에서 "미끄러지는 대신 늦어지는" 모습을 끝까지 남기려고 (사용자 결정)
  hold_s: 5.0             # [s] 완주 뒤 출발점 유지

  # ── 5-3 단일 축 기준 (2026-11-16, core/segment.py). 기본 figure8. 실차 5-3 은 origin_mode:=robot 과 같이:
  #   ros2 launch amr_mpc torque_experiment.launch.py plant:=real use_rviz:=false origin_mode:=robot shape:=line seg_distance:=0.5 speed:=0.2
  #   line   : 출발 몸체 방향 seg_dir_deg (0 앞, 180 뒤, 90 왼쪽, −90 오른쪽, 45 앞왼쪽)로 seg_distance [m]. 속도는 위 speed·accel, 헤딩 고정
  #   rotate : 제자리 seg_angle_deg [deg] (+ 반시계), 각속도 seg_yaw_rate [rad/s]·seg_yaw_accel [rad/s²]
  shape: figure8
  seg_distance: 0.5       # [m]
  seg_dir_deg: 0.0        # [deg]
  seg_angle_deg: 90.0     # [deg]
  seg_yaw_rate: 0.8       # [rad/s] 8자 최대 ω ≈ 1.33 보다 낮게 (2026-11-16: ω ≤ 1.6 에서 추정기 거짓 속도 ≤ 0.1 m/s)
  seg_yaw_accel: 1.6      # [rad/s²]
  seg_out_and_back: true  # 갔다가 seg_pause_s 쉬고 같은 길로 돌아온다
  seg_pause_s: 1.0        # [s]

  # ── 정사각형 (2026-11-20, core/square.py). shape:=square. 출발점(origin)이 꼭짓점, 첫 변이 origin_yaw 방향, 왼쪽으로 돈다
  #   (fixed 출발이면 origin 이 그 꼭짓점 — 정사각형은 origin 의 앞·왼쪽 side × side). laps 바퀴 = 4·laps 변, 속도는 accel 로 정해진다:
  #   변 가운데 최고 √(v_c² + accel·side) — side 1.5: accel 0.4 → 0.78, 1.0 → 1.23 m/s (C 상한 대비 가속 토크 38 % / 94 %).
  #   꼭짓점은 속도 크기 v_c 로 지나며 방향만 90° 꺾인다 (속도 계단 √2·v_c, 0 이면 정지 꼭짓점 = 정확한 정사각형). speed 는 안 쓴다.
  #   yaw_mode: tangent (퓨어 퍼슛도 가능) | fixed (옆걸음, MPC 만) — spin 은 거부.
  #   예) amrall shape:=square yaw_mode:=tangent accel:=1.0 controller:=pure_pursuit
  square_side: 1.5          # [m]
  square_corner_speed: 0.1  # [m/s] 꼭짓점 속도 (첫 출발·마지막 도착은 0)
  square_v_max: 0.0         # [m/s] > 0 이면 변 최고속도를 이 값에서 자름. 0 = 가속으로 낼 수 있는 최고 (부하 예산 V_LIMIT·load_budget 에서만 자름)
  square_yaw_blend: 0.3     # [m] tangent: 꼭짓점 앞뒤 합친 헤딩 회전 구간 (호길이). 0 < 값 ≤ side. 마지막 꼭짓점은 서서 align_s 동안 돌아 출발 헤딩으로
  # 꼭짓점 처리 (2026-11-21). pass = 위대로 (corner_speed 로 지나며 tangent 면 yaw_blend 안에서 헤딩 회전).
  #   stop = 꼭짓점마다 선다 (corner_speed·yaw_blend 무시): 쉼 dwell → (tangent) 제자리 +90° rot_s (스무스스텝) → 쉼 dwell → 다음 변.
  #   accel 1.5 · v_max 1.5 에서 노드가 보는 앞먹임 max |U_s,i| / C 상한 (analysis/torque_mpc_sim/2026-11-20_square_profile):
  #     pass (yaw_blend 0.3)   2.55 — 꼭짓점 구간 내내 초과, 주행 7.6 s
  #     stop rot_s 0.6 / 0.8 / 1.0 / 1.2   1.22 / 0.96 / 0.96 / 0.96 (순수 회전 구간만 1.22 / 0.77 / 0.53 / 0.38)
  #     0.96 = 직선 가감속 (RR) 그 자체. rot_s 1.0 + dwell_s 0.1 → 주행 11.6 s
  #   몸체 v_y 가 어디서나 0 → 퓨어 퍼슛 (v_y = 0) 도 원리상 낼 수 있다. 꼭짓점에서 v_ref = 0 이라 PP 는 회전 모드 (rotate_speed) 로 돈다.
  square_corner_mode: pass  # pass | stop
  square_rot_s: 1.0         # [s] stop + tangent: 꼭짓점 제자리 90° 회전 시간 (ω 최대 1.5·(π/2)/rot_s = 2.36 rad/s)
  square_dwell_s: 0.1       # [s] stop: 회전 앞·뒤 정지 (fixed 면 회전 없이 2·dwell)

  # ── 꺾은선 (2026-11-25, core/polyline.py). shape:=polyline. 꼭짓점·속도·헤딩은 위 square_* 와 공용 accel·yaw_mode·align_s 를 쓴다
  #   명령 R<길이> = 오른쪽 90° 돌고 그만큼, L<길이> = 왼쪽, F<길이> = 그대로 (첫 명령의 회전은 출발 헤딩 기준).
  #   기본 = 정사각형 두 개 (1 m) 를 꼭짓점 하나로 이은 8 자: 출발 좌표 (0,0)→(0,−1)→(1,−1)→(1,1)→(2,1)→(2,0)→(0,0), 8 m.
  #     첫 정사각형은 왼쪽으로, 둘째는 오른쪽으로 돈다. 2 m 직선 두 개가 맞닿은 점 (1,0) 을 지난다. 필요한 바닥 2 m × 2 m.
  #     tangent 면 첫 R 때문에 출발 때 제자리에서 오른쪽 90° 먼저 돈다. 안 돌게 하려면 "F1,L1,L2,R1,R1,R2" (같은 모양, 90° 돌린 것).
  #   꼭짓점은 위 square_corner_mode (기본 pass = 꼭짓점 0.1 m/s 로 지나며 앞뒤 0.3 m 에서 헤딩을 돌림). 2026-11-25 오후: 예전 실차 정사각형 조건
  #   (accel 1.5 · square_v_max 1.5) 시뮬 MPC RMS 35 mm · PP 76 mm (analysis/torque_mpc_sim/2026-11-25_corner_pass). stop 은 square_corner_mode:=stop.
  #   예) amrall use_mpc:=true controller:=mpc shape:=polyline accel:=1.5 square_v_max:=1.5 limit_mode:=friction
  poly_path: "R1,L1,L2,R1,R1,R2"

  # ── 지그재그 (2026-11-24, core/zigzag.py). shape:=zigzag. 출발 포즈에서 길이 zigzag_length 직선 zigzag_n 개,
  #   이웃 직선 사이각 zigzag_angle_deg (진행 방향은 꼭짓점마다 180° − 각 꺾이고, 꺾는 쪽이 번갈아). + 왼쪽 / − 오른쪽으로 나아간다.
  #   직선 양 끝 속도 0. 속도 파형 zigzag_profile: sine = 반 사인 v = V_p sin(πτ/T) (최대 가속 = 양 끝) | square = 사다리꼴
  #   (자르지 않으면 삼각형). laps 는 안 쓴다 (직선 개수 = zigzag_n).
  #   yaw_mode (2026-11-24 (9), 위 공용 yaw_mode·spin_rate·align_s 그대로):
  #     tangent : 헤딩 = 직선 방향, 직선마다 전진·후진 (짝수 전진, 홀수 후진) → 꼭짓점에서 몸체는 사이각만 돈다 (쉼 dwell → 회전 rot_s → 쉼 dwell).
  #               n 짝수면 끝 헤딩이 출발과 사이각만큼 달라 선 뒤 align_s 동안 출발 헤딩으로 제자리 회전.
  #     fixed   : 헤딩 고정, 옆걸음 (꼭짓점은 쉼 2·dwell 만). 퓨어 퍼슛은 v_y = 0 이라 못 간다.
  #     spin    : Figure8 spin 과 같은 식 — 헤딩 = κ_s·호길이, 정수 바퀴 (spin_rate ≈ 직선 최고 속력에서의 ω), 끝에서 출발 헤딩. 퓨어 퍼슛은 못 간다.
  #     fixed·spin 의 accel max 는 경로 전체 앞먹임 ≤ max_ff_ratio 로 찾는다 (옆걸음·요 가속이 직선 식보다 바퀴 토크를 키움).
  #   path_follow_lead 도 쓸 수 있다 — 사영 창이 다음 직선 끝을 넘지 않는다.
  #   가속도·속도는 공용 launch 인자 (2026-11-24 (8), 전용 zigzag_accel·zigzag_v_max 는 지움):
  #     accel:= 최대 가속도 [m/s²] | max = C 마찰 상한 안 직선 가속 한계 (fig8_limits.line_accel_max, max_ff_ratio 적용)
  #     speed:= 직선 최고 속도 상한 [m/s] | max = 부하 예산 load_budget·V_LIMIT 에서만 자름 (정사각형의 square_v_max 와 같은 뜻)
  #     지그재그에서는 둘 다 비우면 max — 위 공용 speed 0.5·accel 0.4 는 지그재그에 안 쓴다 (처음 조건 "가속도를 낼 수 있는 최대로").
  #   5 × 1 m, 10°, accel max (C 상한 1.70) 이면 sine 직선 최고 0.92 m/s · 1.70 s, square 1.30 m/s · 1.53 s.
  #   미리 보기: python3 -m amr_mpc.core.fig8_limits --shape zigzag --zigzag_profile square
  #   예) amrall use_mpc:=true shape:=zigzag zigzag_profile:=square limit_mode:=friction            (= speed:=max accel:=max)
  #       amrall use_mpc:=true shape:=zigzag accel:=1.0 speed:=0.6
  zigzag_n: 5               # 직선 개수
  zigzag_length: 1.0        # [m] 직선 하나 길이
  zigzag_angle_deg: 10.0    # [deg] 이웃 직선 사이각 (0 < |값| < 180)
  zigzag_profile: sine      # sine | square
  zigzag_rot_s: 0.5         # [s] 또는 max. 꼭짓점 제자리 회전 시간 (스무스스텝, 10° 면 ω 최대 1.5·α/rot_s = 0.52 rad/s). max = 경로 전체 앞먹임을
                            #   max_ff_ratio (또는 직선 값) 위로 올리지 않는 가장 짧은 시간 (fig8_limits.zigzag_rot_max). zigzag_reverse false 에서 비우면 max
  zigzag_dwell_s: 0.1       # [s] 회전 앞·뒤 정지
  zigzag_reverse: true      # tangent 만 (2026-11-24 (10)). true = 홀수 직선 후진 (꼭짓점에서 사이각만 돎) | false = 늘 전진 —
                            #   꼭짓점에서 헤딩을 진행 방향으로 ±(180° − 사이각) 돌린다 (짧은 쪽으로 번갈아, 헤딩이 쌓이지 않음). 모양·꼭짓점은 같다
  zigzag_corner: stop       # 2026-11-25. stop = 꼭짓점마다 서서 (쉼 → 회전 → 쉼) | pass = 서지 않고 zigzag_corner_speed 로 지남.
                            #   zigzag_profile square 만, zigzag_rot_s 는 안 쓴다. 늘 전진 (zigzag_reverse false)
  zigzag_turn_m: 0.5        # [m] pass: 꼭짓점 앞뒤 이 거리를 cubic spiral 로 깎는다 (0 < 값 ≤ zigzag_length/2, 곡률이 직선과 이어짐 → 퓨어 퍼슛도 낼 수 있음).
                            #   turn 앞뒤 zigzag_dwell_s 동안 v_c 등속. 0 = 꺾인 채 (꼭짓점에서 속도 방향·헤딩 계단, 11-25 실차 PP·MPC 둘 다 못 따라감)
  zigzag_corner_speed: max  # [m/s] 또는 max. pass 의 꼭짓점 (turn) 속도. max = 경로 전체 C 앞먹임 ≤ max_ff_ratio·부하 예산 안의 최대
                            #   (fig8_limits.zigzag_corner_speed_max, turn_m > 0 만). 10 × 1 m, 30°, turn_m 0.5 → 0.30 m/s

  # 기준열 간격 (R4 리뷰 2026-11-13). MPC·퓨어 퍼슛은 행 사이를 직선으로 보간한다 → 곡선 안쪽으로 줄이 생긴다
  # (현 오차 ≈ v²·dt²/(8R)). 3 × 1.5 m 8자(R_min 0.31 m)에서 최대 보간 오차:
  #   | 속도 | dt 0.2 (예전) | dt 0.1 | dt 0.05 |
  #   | 0.5  | 3.9 mm        | 1.0    | 0.25    |
  #   | 1.0  | 15.4          | 4.0    | 1.0     |
  #   | 1.5  | 32.5          | 8.8    | 2.2     |
  # 그래서 0.05 s × 80 행(4 s, 예전 0.2 × 20 과 같은 길이)으로 낸다. 메시지 80 행 × 10 Hz 는 가볍다.
  dt: 0.05                # [s]
  horizon_steps: 80
