# 토크 MPC 실험 트랙 — 8자 위치·모양·속도 (figure8_reference_node, torque_experiment.launch.py 가 읽는다)
# ===================================================================
# 2026-11-11 결정: 8자를 지도(map)에 고정한다. 노면을 바꿔 가며 B·C 를 비교하려면 8자가 매번 바닥의 같은 자리를
# 지나야 한다 (로봇 기준이면 로봇을 10 cm 옮겨 놓으면 8자 전체가 10 cm 옮겨진다).
#
# 출발: 로봇을 출발점(8자 교차점, 아래 origin) 근처에 origin_yaw_deg 방향으로 놓고 'a'.
#   - 출발점에서 start_tolerance 안이면: 로봇이 있는 곳에서 출발점까지 천천히 들어가는 진입 구간 뒤 8자 시작
#   - 밖이면: 출발을 거부하고 아무 기준도 내지 않는다 (로봇은 DAMPING 으로 서 있다). 옮겨 놓고 다시 'a'
#
# ★ origin 은 아직 임시값이다. 실제 트랙을 smoc_lab 지도 위에 정하고(To do 2절 "8자 트랙 공간")
#   교차점의 지도 좌표와 방향을 재서 넣는다. 바닥에는 출발점과 방향을 테이프로 표시한다.
# 실행 한 번만 바꿀 때는 launch 인자로 덮어쓴다:  origin_x:=1.2 speed:=0.8  (인자 이름 = 아래 키 이름)
# ===================================================================
track:
  origin_mode: fixed      # fixed = 아래 지도 좌표에 고정 | robot = 무장한 순간의 로봇 포즈가 교차점 (예전 방식)
  origin_x: 0.0           # [m]   map 좌표. 임시 (시뮬 플랜트 기동 포즈와 같게)
  origin_y: 0.0           # [m]
  origin_yaw_deg: 0.0     # [deg] 8자 가로축(width) 방향
  start_tolerance_xy: 0.30        # [m]   출발점에서 이보다 멀면 출발 거부
  start_tolerance_yaw_deg: 30.0   # [deg]
  lead_speed: 0.10        # [m/s]   진입 구간 평균 속도 상한 (스무스스텝이라 최고는 1.5 배)
  lead_yaw_rate: 0.5      # [rad/s] 진입 구간 평균 회전 속도 상한

  # 8자 모양 (Gerono 렘니스케이트, core/figure8.py). 임시값 — 실제 공간을 잰 뒤 정한다
  width: 3.0              # [m] 경계상자 가로
  height: 1.5             # [m] 경계상자 세로. 곡률을 정한다 (최소 곡률반경 ≈ W²/(16H))
  yaw_mode: tangent       # tangent = 접선 방향 주행 | fixed = 헤딩 고정 게걸음

  # 속도 (잠정. 모터 무부하 속도 실측 뒤 확정 — torque_mpc_todo.md "속도 프로파일")
  speed: 0.5              # [m/s] 순항 접선 속도
  accel: 0.4              # [m/s²]
  laps: 1.0
  # 랩별 순항 속도 [m/s]. 비우면([]) 위 speed·laps 하나로. 주면 laps = 목록 길이이고 speed 는 쓰지 않는다.
  # 계획(잠정): 30 m 8자에서 [0.5, 1.0, 1.5] — 모터 무부하 속도 실측 뒤 확정. 지금 임시 트랙(3 × 1.5 m, 최소 곡률반경
  # 0.31 m)은 작아서 그 속도면 기준 부하 검사에서 거부된다. 실제 트랙 크기를 정한 뒤 넣는다.
  lap_speeds: []
  align_s: 1.5            # [s] tangent 모드 앞뒤 제자리 회전
  start_delay: 3.0        # [s] 무장 뒤 출발까지 최소 대기 (진입 구간이 더 길면 그 시간)
  abort_error: 0.35       # [m] 기준에서 이만큼 벗어나면 기준 발행을 끊는다 → MPC 정지
  hold_s: 5.0             # [s] 완주 뒤 출발점 유지

  # 기준열 간격 (R4 리뷰 2026-11-13). MPC·퓨어 퍼슛은 행 사이를 직선으로 보간한다 → 곡선 안쪽으로 줄이 생긴다
  # (현 오차 ≈ v²·dt²/(8R)). 3 × 1.5 m 8자(R_min 0.31 m)에서 최대 보간 오차:
  #   | 속도 | dt 0.2 (예전) | dt 0.1 | dt 0.05 |
  #   | 0.5  | 3.9 mm        | 1.0    | 0.25    |
  #   | 1.0  | 15.4          | 4.0    | 1.0     |
  #   | 1.5  | 32.5          | 8.8    | 2.2     |
  # 그래서 0.05 s × 80 행(4 s, 예전 0.2 × 20 과 같은 길이)으로 낸다. 메시지 80 행 × 10 Hz 는 가볍다.
  dt: 0.05                # [s]
  horizon_steps: 80
