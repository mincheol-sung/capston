roboclaw_mecanum_node:
  ros__parameters:
    # udev 룰(99-amr-usb.rules)이 보드 시리얼 RCLEFT12/RCRIGHT12 기준으로
    # 심링크를 만든다. ttyACM 열거 순서가 바뀌어도 좌우가 안 뒤집힌다.
    left_port: /dev/roboclaw_left
    right_port: /dev/roboclaw_right

    baudrate: 115200
    serial_timeout_s: 0.01
    require_ack: true
    mock_mode: false

    # Packet serial address. RoboClaw factory default is usually 0x80, decimal 128.
    # These boards are on separate serial ports, so they can both use 128.
    left_address: 128
    right_address: 129

    # Measure these on the actual robot before driving on the floor.
    wheel_radius_m: 0.04
    wheel_base_m: 0.1897
    robot_width_m: 0.207

    # RoboClaw SpeedM1/SpeedM2 receives encoder counts per second.
    # 2026-08-18 실측: 네 바퀴를 손으로 10회전씩 돌려 카운트 델타를 쟀다.
    # 1320 counts/rev (= 44 counts x 30:1 기어비), 바퀴 간 편차 0.27% 로
    # 스칼라 하나면 충분. 1320 / 2pi = 210.08
    qpps_per_rad_per_sec: 210.08
    # 2026-09-02: 1 m/s 식별 캠페인용으로 8.0 → 26.0.  09-03 재식별 후 30.0 으로 확정:
    #   0.3~1.0 m/s 도달률 1.00, 1.0 m/s 추종에 보정 예산이 남는 최소값. mpc.py W_MAX / mpc_node 파라미터와 같게.
    #   실측 근거: 정상 PWM ≈ 2.04·ω + 4 [%] → 25 rad/s 에서 55 %. 무부하 외삽 47 rad/s.
    #   MPC 의 V_LIMIT 은 mpc.py 의 W_MAX 가 따로 정하므로 여기만 올려도 MPC 명령은 안 커진다.
    #   식별 끝나고 운용 한계를 정하면 그 값으로 내릴 것 (텔레옵 등 다른 노드도 이 한계를 쓴다).
    max_wheel_rad_per_sec: 38.0
    cmd_timeout_s: 0.5
    # Stop and suppress measured-state output when any encoder has supplied no
    # accepted sample for this long. Short read glitches may retain the last value.
    feedback_timeout_s: 0.25
    battery_publish_rate_hz: 1.0
    # 누적 엔코더 읽기 실패율을 이 주기로 경고한다. 실패 샘플은 0 대신
    # 채널별 마지막 정상 속도를 유지한다. 0 이하이면 통계 경고를 끈다.
    feedback_report_period_s: 5.0

    # 엔코더 속도 샘플 게이트 (2026-09-28). 거른 샘플은 읽기 실패처럼 마지막
    # 정상값을 유지하고 위 통계 경고에 "rejected" 로 센다.
    # 계기: bag mpc_chain_20260923_135606 t=314.24 s, rear_right 한 샘플이
    #   -16,779,142 qpps(≈ -2^24) 로 읽혔다. Basicmicro 는 CRC16 을 검사하므로
    #   배선 잡음이 아니라 보드가 보낸 값으로 보인다(원인 미확인). /odom 이
    #   22.6 m 순간이동해 cartographer 측위가 21 m 날아갔다.
    # 크기: 무부하 외삽 47 rad/s(위 주석) 초과는 물리적으로 불가능 -> 60.
    # 변화율: 최소 시상수 τ = 0.093 s(plant_wheel.yaml RR)로 -38 -> +38 계단을
    #   줘도 초기 기울기 76/0.093 = 817 rad/s^2. 1.5 배 여유 -> 1250
    #   (20 ms 주기에서 25 rad/s). 문턱은 마지막으로 받은 값 이후 경과 시간에
    #   비례하므로 읽기 실패·스톨 뒤의 정상 변화는 걸리지 않는다.
    # 연속 거부 상한: 변화율 게이트는 2 번까지만 연속으로 버리고 3 번째는 받는다.
    #   지속되는 변화는 진짜로 본다. 크기 게이트에는 상한이 없다.
    feedback_max_wheel_rad_per_sec: 60.0
    feedback_max_wheel_accel: 1250.0
    feedback_max_step_rejects: 2

    # 100 Hz 전환 (2026-10-22, MPC 100 Hz 지시). 아래 기본값은 전부 그 전 동작과 같다 — 실측 전에는 바꾸지 말 것.
    # 한 주기 = 보드마다 속도 읽기 + (wheel_cmd 가 오면) 속도 쓰기. 시리얼 트랜잭션 하나가 USB 왕복이라
    # 100 Hz 가 들어가는지는 보드에 달렸다. 먼저 드라이버를 끄고:
    #   ros2 run amr_base roboclaw_probe bench          통신 시간, GetSpeeds(108) 지원 여부, 구성별 최대 Hz
    #   ros2 run amr_base roboclaw_probe delay          (바퀴 띄우고) θ 를 구동 지연 / 속도 측정 지연으로 분해
    # 그 결과로 고른다:
    #   update_rate_hz    읽기·/odom·/measured_wheel_speeds 발행 주기
    #   speed_read_mode   per_motor = ReadSpeedM1+M2 (보드당 2 회) | combined = GetSpeeds (보드당 1 회, 펌웨어 지원 필요)
    #                     | encoder = GetEncoders 카운트 차분 / host 시각 (보드당 1 회)
    #   parallel_boards   true 면 좌우 보드를 스레드 둘로 동시에 읽고 쓴다 (포트·잠금이 따로라 안전)
    #   serial_retries    읽기 실패 하나가 serial_timeout_s × 이 값을 쓴다. 100 Hz 에서 2 면 한 번 실패에 두 주기
    # 실주행 중 확인: /roboclaw/io_timing = [이번 주기 읽기 ms, 마지막 쓰기 ms, update_rate_hz]
    # 위 변화율 게이트는 경과 시간에 비례하므로 주기를 바꿔도 그대로 둔다.
    #
    # 2026-10-22 실측 (roboclaw_probe bench, 펌웨어 USB Roboclaw 2x15A v4.4.9 두 보드, 각 300 회, 실패 0):
    #   읽기 명령 하나 p50 0.11 / p99 0.65 ms,  SpeedM1M2 p50 0.26 / p99 1.07 ms,  GetSpeeds(108) 지원
    #   한 주기(보드마다 읽기 + 쓰기)  per_motor 순차 p99 1.82 ms (550 Hz) · 병렬 1.59 · combined 순차 1.58 · 병렬 1.38
    #   → 지금 방식(per_motor, 순차)으로 100 Hz 에 1.8 ms. combined·parallel 은 필요 없다. 통신은 θ 40 ms 의 원인이 아니다.
    update_rate_hz: 100.0
    # 2026-10-22 실측 (바퀴 띄움, roboclaw_probe delay 8 에지 × 4 바퀴): 명령 → 속도의 FOPDT
    #   실제 바퀴(카운트 차분)  θ 10.3~11.9 ms, τ 15.3~16.5 ms
    #   cmd 18 (per_motor)      θ 28~34 ms,   τ 85~93 ms   → 실제보다 θ+τ 로 91~94 ms 늦다. 펌웨어 속도 필터, 이득은 0.98~0.99
    #   드라이버를 거쳐 (/wheel_cmd → /measured_wheel_speeds): per_motor θ+τ 119.8 ms, encoder 32.6 ms. 잡음 1σ 0.016 vs 0.35 rad/s
    #   → 지금까지의 sysid τ ≈ 100 ms (plant_wheel.yaml) 는 대부분 이 필터다. /odom twist 도 같은 만큼 늦다.
    # encoder 로 바꾸는 것은 바닥 계단 sysid(encoder 모드)로 plant_wheel.yaml 모델을 다시 잡은 뒤에 같이 한다 —
    # 지금 Python wheel MPC 모델은 cmd 18 기준이라 측정만 바꾸면 어긋난다. EKF odom 공분산도 다시 볼 것.
    speed_read_mode: per_motor
    parallel_boards: false
    serial_retries: 2

    # /odom 공분산. 전부 0 으로 내보내면 EKF 가 휠 오도메트리를 과신해
    # IMU·SLAM 보정이 안 먹는다. sigma 기준 vx 0.1 m/s, vy 0.2 m/s,
    # vyaw 0.3 rad/s 수준으로 잡았다. 메카넘은 횡·회전 슬립이 커서 vy·vyaw 를
    # 더 크게 둔다. pose 는 추측항법이라 이동량에 비례해 계속 자란다.
    # 실측 튜닝: 바닥 표시 왕복 주행 후 /odom 과 실제 위치 차이로 growth 조정.
    odom_twist_cov_vx: 0.01
    odom_twist_cov_vy: 0.04
    odom_twist_cov_vyaw: 0.09
    odom_pose_cov_initial: 0.001
    odom_pose_cov_growth_xy: 0.02
    odom_pose_cov_growth_yaw: 0.05
    odom_pose_cov_max: 25.0
    odom_cov_unused: 1000000.0

    publish_tf: true
    odom_frame_id: odom
    # Must be base_footprint: the URDF already provides the fixed
    # base_footprint -> base_link joint, and a TF frame cannot have two
    # parents (odom -> base_link would break the tree in RViz).
    base_frame_id: base_footprint

    # Set any wheel to -1.0 if it spins opposite to the expected direction.
    invert_front_left: 1.0
    invert_front_right: 1.0
    invert_rear_left: 1.0
    invert_rear_right: 1.0

    # Map logical wheel names to the physical RoboClaw output.
    # Valid outputs: left_m1, left_m2, right_m1, right_m2.
    front_left_output: left_m2
    front_right_output: right_m1
    rear_left_output: left_m1
    rear_right_output: right_m2
