# depth_preprocess_node — D455 점군 공통 전처리 (설계문서 §3.2-3)
#
# 여기서 나온 /traversability/cloud_filtered 를 octomap_server 와 STVL 이
# 똑같이 받는다. §3.3 의 비교 실험 조건 "공통 D455 전처리·투영·Planning 연결을
# 유지하고 3D 갱신 모듈만 교체한다" 를 이 노드 하나로 보장한다.
depth_preprocess_node:
  ros__parameters:
    cloud_topic: /camera/depth/color/points
    filtered_topic: /traversability/cloud_filtered
    band_topic: /traversability/cloud_band

    # 3D 누적은 연속적인 odom 로컬 윈도우에서 한다(§3.2). 위치추정 보정이
    # 과거 자세를 소급 변경하는 map 에 누적하면 정합이 어긋난다.
    output_frame: odom
    # z 를 재는 기준. base_footprint 원점이 지면이라 밴드 값을 그대로 읽는다.
    height_frame: base_footprint

    # ── z-band (§4.1) ────────────────────────────────────────────────────
    # URDF 실측 카메라 높이 H = 0.04 + 0.092772 = 0.132772 m.
    # 문서의 초기 후보 z_min = -0.15 m (카메라 기준) 는 지면 기준
    # H - 0.15 = -0.017 m 이라 바닥면이 통째로 밴드에 들어온다. 문서의 예시는
    # H = 0.50 m 를 가정한 것이라 이 로봇에서는 부호가 뒤집힌다.
    # 그래서 카메라 기준 -0.10 m, 지면 기준 +0.033 m 를 쓴다.
    #   z_max = 로봇 최고점(LiDAR 상단 약 0.258 m) + 여유 0.05 m
    # traversability.yaml · octomap.yaml 의 같은 값과 반드시 일치시킬 것.
    z_min: 0.033
    z_max: 0.31

    # ── 유효 거리 ────────────────────────────────────────────────────────
    # base_footprint 원점 기준 수평거리.
    # 0.30 m: D455 depth Z-min 약 0.4 m 이고 수평 장착 기준 바닥이 시야에
    #   들어오는 거리가 H/tan(29도) = 0.24 m 다. 그 안쪽 값은 믿지 않는다.
    # 6.0 m: 이 거리에서 0.05 m 셀 하나를 덮는 픽셀이 약 8개뿐이라
    #   노이즈 한두 점이 그대로 점유가 된다.
    min_range: 0.30
    max_range: 6.0

    # ── 2D 밴드 전용 상한 (카메라 원점 기준 수평거리) ────────────────────────
    # max_range 와 별개다. 2D 격자는 셀에 점이 하나만 떨어져도 그 프레임의 hit
    # 으로 세고(depth_hit_threshold 2 프레임만 넘으면 BLOCKED), 노이즈 걸러낼
    # 누적이 없다. 그래서 원거리 점이 그대로 유령 장애물이 된다.
    #
    #   거리    셀 폭    셀 면적   깊이오차(2 %)   오차/셀
    #   1.5 m  14.0 px   197 px²    0.030 m        0.6
    #   2.5 m   8.4 px    71 px²    0.050 m        1.0   <- 오차 = 1 셀
    #   6.0 m   3.5 px    12 px²    0.120 m        2.4
    #
    # 1.5 m 대 6.0 m: 셀당 픽셀 16 배, 깊이오차 4 배 작다.
    # 깊이오차가 1 셀을 넘는 거리가 2.50 m 이므로 그 안쪽에서 고른 값이다.
    #
    # ※ 원점이 base_footprint 가 아니라 **카메라**다. URDF base_link ->
    #   camera_link xyz 0.11398 이라 두 원점이 x 로 0.114 m(약 2.3 셀) 다르다.
    #   노드는 TF 에서 카메라 위치를 읽어 쓰므로 여기 값을 바꿔도 그 보정은
    #   자동으로 따라온다.
    #
    # 3D 쪽(cloud_filtered -> octomap)은 이 상한을 안 받는다. log-odds 로 여러
    # 관측을 누적해 노이즈를 판정하므로 원거리 점도 쓸 값이 있다.
    band_max_range: 1.5

    # ── 다운샘플 ─────────────────────────────────────────────────────────
    # 0.5 m 에서 셀당 약 1137 px, 6 m 에서 약 8 px 로 밀도가 140배 차이난다.
    # 다운샘플이 없으면 근거리 점이 연산량을 독차지한다.
    voxel_leaf: 0.03
    # 다운샘플 전에 거는 상한. 640x480 = 307200 점이 그대로 들어오면
    # 파이썬에서 프레임당 수백 ms 가 걸린다. 결정적 균등 추출을 쓴다.
    max_input_points: 120000

    # ── 자기 관측 제거 (§3.2-3) ──────────────────────────────────────────
    # height_frame 기준 축정렬 상자. URDF base_link 충돌박스는
    # 0.28584 x 0.18841 x 0.16701 이고 지면 위 0.0219~0.1889 m,
    # LiDAR 마운트가 0.2178 m 다. 여기에 여유를 조금 준 크기다.
    # ※ 상자를 키우면 차체 앞의 실제 장애물까지 지운다. 로봇팔·적재물이
    #   붙기 전까지 이 값을 키우지 말 것.
    self_filter_box_min: [-0.20, -0.15, -0.05]
    self_filter_box_max: [0.20, 0.15, 0.28]

    # RealSense stamp 와 TF 가 어긋나면 전 프레임이 버려진다.
    tf_timeout: 0.20
    use_latest_tf: true
    # 처리량 요약 로그 주기 [s]. 0 이면 끈다.
    log_period: 5.0
