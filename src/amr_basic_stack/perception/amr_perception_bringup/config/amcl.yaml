# nav2_amcl — cartographer 측위의 초기 위치를 자동으로 잡기 위한 보조 측위.
#
# ★ 이 AMCL 은 map -> odom TF 를 내지 않는다 (tf_broadcast: false).
#   그 TF 의 주인은 ekf_carto(robot_localization) 이고, 둘이 같이 내면 TF 트리에
#   부모가 둘인 프레임이 생겨 전부 깨진다. AMCL 은 /amcl_pose 만 낸다.
#   amcl_bootstrap_node 가 그걸 받아 수렴을 판정하고 /initialpose 로 넘긴다.
#
# 지도는 nav2_map_server 의 /map 을 그대로 쓴다 — cartographer 가 매핑 때 저장한
# 바로 그 PGM 이라 좌표계가 정확히 일치한다.
amcl:
  ros__parameters:
    # ── 좌표계 ───────────────────────────────────────────────────────────
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    map_topic: /map
    # ★ 절대 true 로 바꾸지 말 것. 위 주석 참조.
    tf_broadcast: false
    transform_tolerance: 0.5

    # ── 초기화 ───────────────────────────────────────────────────────────
    # 초기 pose 를 주지 않는다. amcl_bootstrap_node 가
    # /reinitialize_global_localization 을 불러 자유공간 전체에 뿌린다.
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

    # ── 파티클 ───────────────────────────────────────────────────────────
    # 전역 측위는 지도 전체에 뿌리므로 파티클이 넉넉해야 한다. NUC 의 여유를
    # 보고 정한 값이며, 수렴이 느리면 max_particles 를 올린다.
    min_particles: 1000
    max_particles: 8000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    # 파티클이 엉뚱한 곳에 갇혔을 때 무작위 파티클을 섞어 빠져나오게 한다.
    # 0 이면 그 복구가 없다.
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    # ── 갱신 조건 ────────────────────────────────────────────────────────
    # 이만큼 움직여야 파티클을 갱신한다. 작게 잡으면 자주 갱신되어 수렴이
    # 빠르지만 CPU 를 더 쓴다. 로봇이 작아서(0.29 x 0.19 m) 작게 잡았다.
    update_min_d: 0.15
    update_min_a: 0.20

    # ── 센서 모델 ────────────────────────────────────────────────────────
    # likelihood_field 는 beam 보다 싸고 실내에서 안정적이다.
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    # 앞뒤 RPLIDAR S2 병합 스캔. 실제 유효거리에 맞춘다.
    laser_min_range: 0.15
    laser_max_range: 8.0
    max_beams: 120
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # ── 오도메트리 모델 ──────────────────────────────────────────────────
    # 메카넘휠은 전방향이므로 omni 모델을 쓴다. differential 을 쓰면 측방
    # 이동을 표현할 수 없어 파티클이 잘못 퍼진다.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    # alpha1~3 회전/이동 잡음, alpha4 이동에 의한 회전 잡음,
    # alpha5 는 omni 모델의 측방(strafe) 잡음이다.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    save_pose_rate: 0.5

amcl_bootstrap_node:
  ros__parameters:
    map_frame: map
    amcl_pose_topic: /amcl_pose
    odometry_topic: /odometry/filtered
    initialpose_topic: /initialpose
    global_localization_service: /reinitialize_global_localization

    # 기동 후 이 시간 뒤 전역 측위를 스스로 건다. false 로 두면 사용자가
    # 직접 서비스를 부른 뒤 수렴만 지켜본다.
    trigger_global_localization: true
    trigger_delay: 3.0

    # 한 번 넘기고 끝낸다. 주행 중에 초기 위치를 다시 밀어 넣으면
    # cartographer 궤적이 끊기고 EKF 가 리셋된다.
    oneshot: true

    # ── 수렴 기준 ────────────────────────────────────────────────────────
    # x, y 표준편차 [m] 와 yaw 표준편차 [deg] 가 둘 다 이 아래여야 한다.
    position_std: 0.30
    yaw_std_degrees: 15.0
    # 연속 N 회 만족해야 확정한다. 한 번 튄 값으로 성급히 넘기지 않는다.
    required_samples: 5
    # 그 전에 로봇이 최소 이만큼 움직였어야 한다 [m]. 누적은 /odometry/filtered
    # 의 x·y hypot 합, 즉 **경로 길이**다 — 제자리 회전은 0 을 더한다.
    #
    # ★ 0 인 이유: amcl_wiggle_node 의 pattern 이 rotate_only 라 병진이 없다.
    #   0 이 아니면 파티클이 아무리 모여도 travel_satisfied 가 False 로 남아
    #   ConvergenceTracker.converged 가 영원히 안 떨어진다.
    #
    # 대가: 원래 이 값이 막던 것은 "한 지점에서 본 스캔만으로 대칭 구간에
    # 자신 있게 잘못 수렴" 이다. 그 방어가 통째로 verify_with_scan 으로 넘어갔다
    # (아래 min_match_score 0.55, 180도 뒤집힌 pose 의 실측 점수 0.200).
    # 검증이 계속 실패하면(max_retries 소진) pattern 을 square 로 되돌리고
    # 이 값을 1.0 으로 올리는 것이 정답이다.
    min_travel: 0.0
    # 진행 상황 로그 주기 [s]. 0 이면 끈다.
    status_period: 3.0

    # ── 스캔-지도 정합 검증 ──────────────────────────────────────────────
    # ★ 공분산만으로는 부족하다. AMCL 은 대칭적인 실내에서 자신 있게 틀린
    #   곳에 수렴한다. 2026-09-09 실측(test_imu_scan): 위치 오차 6.4 m,
    #   방향 165 도(180 도 모호성)인데 std 는 0.215 m / 8.2 도 였다.
    #   그래서 수렴한 pose 에 현재 스캔을 얹어 벽에 붙는 비율을 센다.
    verify_with_scan: true
    # 스캔 끝점이 이 거리 안의 점유 셀에 붙으면 hit [m].
    match_distance: 0.20
    # hit 비율이 이 값 이상이어야 통과.
    # 2026-09-09 실측 (test_imu_scan, match_distance 0.20, 180 빔):
    #     정답 pose            1.000
    #     10 도 회전            0.717
    #     0.3 m 이동            0.494
    #     1 m 이동              0.256
    #     180 도 뒤집기          0.200
    #   -> 0.55 면 0.3 m/10 도 수준의 오차까지만 통과한다.
    # ※ match_distance 를 키우면 구분력이 급격히 떨어진다. 같은 실측에서
    #   지도의 "장애물 근처" 비율이 0.05 m 에서 5.7 %, 0.10 m 에서 12.1 %,
    #   0.20 m 에서 23.2 % 다. 이 비율이 곧 엉뚱한 pose 의 기저 점수다.
    min_match_score: 0.55
    # 격자 안에 든 표본이 이보다 적으면 점수를 믿지 않는다.
    min_match_points: 40
    # 검증 실패 시 전역 측위를 다시 거는 횟수.
    max_retries: 3
    base_frame: base_footprint
    map_topic: /map
    scan_topic: /scan

# amcl_wiggle_node — 수렴에 필요한 최소 이동을 자동으로 만든다.
#
# 왜 필요한가: AMCL 은 update_min_d 0.15 m / update_min_a 0.20 rad 를 넘는
# 이동이 없으면 파티클을 갱신하지 않는다. 그 이동을 사람이 조이스틱으로
# 만들던 것을 노드가 대신한다. 두 문턱은 OR 이라 제자리 회전도 update_min_a
# 를 넘겨 갱신을 일으킨다 — 2 바퀴 = 4π / 0.20 ≈ 63 회.
#
# ★ 현재 pattern 은 rotate_only 다. 병진 구간이 없으므로 위의 min_travel 이
#   0 이어야 한다(그 항목의 주석 참조). square 로 되돌릴 때는 min_travel 도
#   1.0 으로 같이 올릴 것 — 둘은 한 쌍이다.
#     square 0.20 m × 4 구간 × 2 바퀴 = 경로 1.60 m  >  min_travel 1.0 m
amcl_wiggle_node:
  ros__parameters:
    odometry_topic: /odometry/filtered
    initialpose_topic: /initialpose
    # 게이트(keyboard_command_gate) 의 **입력** 토픽이다. 출력(/wheel_cmd)에
    # 직접 쓰면 게이트가 내는 0 과 섞인다 — 게이트는 disarmed 여도 50 Hz 로
    # 0 을 발행한다.
    wheel_cmd_topic: /wheel_mpc/cmd_raw
    arm_topic: /mpc/arm

    # plant_wheel.yaml geometry 와 반드시 같은 값. k = (base + width)/2 = 0.19835
    wheel_radius: 0.04
    wheel_base: 0.1897
    robot_width: 0.207

    # rotate_only: 병진 없이 제자리 회전만 한다. 로봇 주변을 비울 필요가 없고
    #   출발점에서 한 발짝도 안 움직인다. min_travel 0 이 전제다.
    #   한계 — 360도 LiDAR 는 제자리에서 돌아도 보는 장면이 같으므로 위치
    #   모호성이 회전으로는 안 풀린다. yaw 는 묶인다(스캔이 로봇 프레임
    #   기준이라 회전하면 각도가 시프트되고 likelihood_field 가 그걸 잡는다).
    #   대칭 복도에서는 수렴이 안 되거나(안전한 실패) 틀린 곳에 모인다.
    #   후자는 verify_with_scan 이 막는다.
    # square: 전 -> 우 -> 후 -> 좌. 회전이 없어 출발점으로 정확히 돌아온다.
    #   전후 왕복만 하면 그 축 방향 모호성이 안 풀려 min_travel 카운터만 차고
    #   position_std 가 안 떨어진다. 메카넘이라 측방이 공짜이므로 직교 방향
    #   정보를 같이 넣는다.
    # forward_back: 측방 공간이 없을 때. 이때는 laps 를 3 이상으로.
    pattern: rotate_only
    leg_distance: 0.20
    laps: 2
    # 0.10 m/s 에서 바퀴는 0.10/0.04 = 2.5 rad/s — 한계 30 의 8 %.
    speed: 0.10

    # ── 제자리 회전 ──────────────────────────────────────────────────────
    # 지금은 이게 유일한 구간이다(pattern: rotate_only).
    #
    # 무엇이 묶이나: yaw 다. 병진만으로는 yaw 공분산이 잘 안 줄어든다 —
    # 360° LiDAR 가 평행이동만 하면 위치는 잘 묶이지만 자세는 약하게 묶인다.
    # ConvergenceTracker 는 위치와 yaw 를 **함께** 보므로(위 yaw_std_degrees
    # 15.0), 사각형만 돌면 position_std 는 내려가는데 yaw_std 가 문턱에 걸려
    # 수렴 판정이 안 떨어질 수 있다. 회전이 그 축을 묶는다.
    #
    # 무엇이 안 묶이나: 위치다. 회전은 시점을 바꾸지 않아 대칭 구간의 위치
    # 후보를 못 지운다. 그 방어는 verify_with_scan 이 맡는다.
    #
    # 파티클 갱신: update_min_a(0.20 rad) 를 계속 넘긴다.
    #   2 바퀴 = 4π rad → 4π / 0.20 ≈ 63 회.
    #
    # ※ square/forward_back 과 함께 쓰면 노드는 병진을 모두 끝낸 **뒤에**
    #   회전한다. 순서를 뒤집으면 대칭 구간에서 엉뚱하게 붙는다.
    #
    # 회전은 min_travel 에 기여하지 않는다(누적은 x·y 경로 길이다).
    #
    # 0 으로 두면 회전 단계를 건너뛴다 — rotate_only 에서는 할 일이 하나도
    # 없어지므로 노드가 기동 시 ValueError 로 막는다.
    rotate_revolutions: 2.0
    # 0.5 rad/s 에서 바퀴는 0.5 × 0.19835 / 0.04 = 2.48 rad/s — 병진과 같은 크기.
    # 2 바퀴 = 4π / 0.5 = 25.1 s. 사각형 16 s 와 합쳐 41 s 로 max_duration 안이다.
    yaw_rate: 0.5

    # 게이트·드라이버가 뜨기 전에 쏘면 첫 구간이 버려진다.
    start_delay: 5.0
    # 바퀴가 헛돌거나 odom 이 이상하면 여기서 끝낸다.
    # 계획 시간(rotate_only): 회전 4π / 0.5 rad/s = 25.1 s. 여유 3 배 이상.
    #   square 로 되돌리면 + 8 구간 × 0.20 m / 0.10 m/s = 16 s => 약 41 s.
    max_duration: 90.0
    odom_timeout: 0.5
    # wheel_tracking 이 같은 토픽에 0 을 계속 내므로, 그보다 높게 두어야
    # 게이트가 내보내는 명령의 duty 가 확보된다.
    publish_frequency: 100.0
    # 끝나면 게이트를 내린다. 자율주행 전에 사람이 arm 하게 남기는 것이다.
    disarm_when_done: true
    max_wheel_rad_per_sec: 30.0

amcl_lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names: ["amcl"]
    bond_timeout: 0.0
